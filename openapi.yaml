          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: proposeCodexContent
      summary: Offer your homebrew to the table (members; DM decides)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentIds
              properties:
                contentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Proposed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/codex/bulk:
    parameters:
      - $ref: "#/components/parameters/CampaignId"

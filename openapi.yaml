        "403":
          $ref: "#/components/responses/Forbidden"
  /encounters/{encounterId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    get:
      operationId: getEncounter
      summary: One encounter with its combatants — full detail (DM only)
      responses:
        "200":
          description: The encounter and its combatants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEncounter
      summary: Rename, trigger/end, or advance the tracker (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEncounterRequest"
      responses:
        "200":
          description: The updated encounter and combatants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEncounter
      summary: Discard an encounter and its combatants (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/filing:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    put:
      operationId: fileEncounter
      summary: File an encounter under a session tag and/or a place (DM only)
      description: Replaces the encounter's filing wholesale, so one call can move it, unpin it, or clear its tag. The library groups on these two fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileEncounterRequest"
      responses:
        "200":
          description: The refiled encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/combatants:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    post:
      operationId: addCombatant
      summary: Add a Den monster, a seated PC, a traveling ally, or a custom line (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCombatantRequest"
      responses:
        "201":
          description: The combatants added — one element for a lone addition, or every member of the group when count > 1.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Combatant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/roll-initiative:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    post:
      operationId: rollInitiative
      summary: Roll initiative (d20 + modifier) for every combatant at once (DM only)
      responses:
        "200":
          description: The encounter with rolled initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /combatants/{combatantId}:
    parameters:
      - $ref: "#/components/parameters/CombatantId"
    patch:
      operationId: updateCombatant
      summary: Edit a combatant — HP, initiative, reveal, rename (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCombatantRequest"
      responses:
        "200":
          description: The updated combatant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combatant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCombatant
      summary: Remove a combatant (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/combatant-groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCombatantGroup
      summary: Remove a whole mob at once (DM only)
      description: Deletes every combatant sharing this groupId. Removing one dead skeleton is still a plain combatant delete; this is for clearing the entire unit.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /combatants/{combatantId}/roll:
    parameters:
      - $ref: "#/components/parameters/CombatantId"
    post:
      operationId: rollCombatantInitiative
      summary: Roll this combatant's initiative (DM, or the owner of a PC combatant)
      responses:
        "200":
          description: The combatant with a fresh initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combatant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/npcs:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listNpcs
      summary: The people of a campaign. The DM sees everyone with both veils spelled out; a player sees only the NPCs their heroes' veil resolves visible, and reads stats only where the second veil allows.
      responses:
        "200":
          description: NPCs, redacted for the viewer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Npc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createNpc
      summary: Bring a person into the campaign (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcInput"
      responses:
        "201":
          description: The new NPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /npcs/{npcId}:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateNpc
      summary: Rename a person, move them, or change what stands behind them (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcInput"
      responses:
        "200":
          description: The NPC after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteNpc
      summary: Strike a person from the campaign (DM only)
      responses:
        "204":
          description: Gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /realms:
    get:
      operationId: listRealms
      summary: The caller's own realms
      description: Realms belong to whoever made them and are listed to nobody else (#233). A player reads their campaign's realm NAME off the campaign itself; the list, which is what feeds the "found a campaign here" picker, is the owner's alone. Empty realms are included.
      responses:
        "200":
          description: Your realms, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Realm"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /realms/{realmId}:
    parameters:
      - name: realmId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameRealm
      summary: Rename a realm (owner only)
      description: A backfilled realm is named after its one campaign, which is rarely what the setting is actually called — renaming is how it stops being a private container and starts being a place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmInput"
      responses:
        "200":
          description: The renamed realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRealm
      summary: Strike an empty realm (owner only)
      description: Refused while any campaign stands in it — a realm holds years of play and is never a way to delete them sideways. Empty it first, by moving or striking the campaigns themselves.
      responses:
        "204":
          description: Struck
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/realm:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setCampaignRealm
      summary: Move a campaign into another of your realms (owner only)
      description: "Nothing is shared between campaigns in stage one, so moving costs a table nothing and takes nothing from it. It exists because backfill gave every campaign that already existed a realm of its own: without a way to move one, the container would do nothing at all for the tables running today."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRealmRequest"
      responses:
        "200":
          description: The campaign, now standing in that realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/parties:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listParties
      summary: The parties at this table
      responses:
        "200":
          description: The campaign's parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createParty
      summary: Form a new party (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: The new party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /parties/{partyId}:
    parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameParty
      summary: Rename a party (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "200":
          description: The party as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteParty
      summary: Disband a party (DM only)
      description: The heroes stay, and so does everything they were ever shown — a party is a brush, and nothing hangs on it (#232).
      responses:
        "204":
          description: Disbanded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/party:
    parameters:
      - name: characterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setCharacterParty
      summary: Move a hero to a party, or out of all of them (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPartyRequest"
      responses:
        "200":
          description: The hero as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/travel:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setNpcTravel
      summary: Mark a person as walking with the party, and hand them to a runner (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcTravelInput"
      responses:
        "200":
          description: The person as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/hp:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setNpcHp
      summary: Move a traveling ally's hit points
      description: "Open to the DM and to whoever holds the ally, and to nobody else — a player who is not their runner is refused exactly as a stranger is. The value lands wherever that ally's points live: on the sheet for a forged body, on the person's own row for one carried by a stat block. Refused for a person who is not traveling, or who has nothing behind them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcHpInput"
      responses:
        "200":
          description: The ally as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/body:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: forgeNpcBody
      summary: Forge a character sheet for this person (DM only)
      description: "Creates a sheet that belongs to this person and attaches it in one act (#227). The body is the DM's, campaign-scoped, and never a seat: it is absent from the party roster, the adventurer count and every veil resolved through heroes. A person carries a stat block or a sheet and never both, so forging one clears any Den monster standing behind them. Refused when this person already has a sheet."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: The person, with their new sheet behind them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/visibility:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setNpcVisibility
      summary: Reveal or hide a person, for the party or for one hero (DM only). Choosing the party clears every per-hero exception.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: The NPC with its veil as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/visibility/{characterId}:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: characterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: clearNpcVisibilityOverride
      summary: Drop one hero's exception so they follow the party again (DM only)
      responses:
        "200":
          description: The NPC with its veil as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/stats-visibility:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setNpcStatsVisibility
      summary: Reveal or hide a person's stat block or sheet, for the party or for one hero (DM only). The stats only ever show where the person themselves is visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: The NPC with its veils as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /npcs/{npcId}/stats-visibility/{characterId}:
    parameters:
      - name: npcId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: characterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: clearNpcStatsVisibilityOverride
      summary: Drop one hero's stats exception so they follow the party again (DM only)
      responses:
        "200":
          description: The NPC with its veils as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  security:
    - sessionCookie: []
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TreeId:
      name: treeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - class
          - species
          - background
          - subclass
          - feat
          - spell
          - item
          - monster
          - rule
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PinId:
      name: pinId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CombatantId:
      name: combatantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoutId:
      name: handoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed (not a member, or insufficient role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Role:
      type: string
      enum:
        - dm
        - player
    User:
      type: object
      required:
        - id
        - name
        - provider
        - emailVerified
        - twofaEnabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        provider:
          type: string
          description: Where the account came from — discord, google, local, or dev.
        emailVerified:
          type: boolean
          description: Whether the account's email address is confirmed (OAuth accounts always are).
        twofaEnabled:
          type: boolean
          description: Whether the account has TOTP two-factor authentication turned on (local accounts only).
        waiting:
          type: object
          required:
            - requests
            - unread
          description: What is waiting on this account (#181) — friend requests to answer, and direct messages unread. It rides /me, which the shell already fetches, so the header's badge costs no request of its own; the account's own live stream makes /me stale when either number moves.
          properties:
            requests:
              type: integer
            unread:
              type: integer
        createdAt:
          type: string
          format: date-time
    Campaign:
      type: object
      required:
        - id
        - name
        - ownerUserId
        - createdAt
        - realmId
        - realmName
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        realmId:
          type: string
          format: uuid
          description: The realm this campaign stands in (#233). Every campaign has one — a table founded on its own ground gets a realm of its own, named after it — so this is never absent and never null.
        realmName:
          type: string
          description: "What that realm is called. It reaches everyone at the table, DM and player alike: the name of the setting is not a secret, and this is the only place a player ever reads it. Listing, renaming, moving and striking realms remain the owner's alone."
        inviteCode:
          type: string
          description: |
            DM-only. The code that admits anyone holding it, so it reaches the DM's payloads and nobody else's — it used to be required, which meant every player read their table's code out of `GET /campaigns` however carefully the screen hid it, and could hand it on after being kicked or banned (#207). Absent, not blank: a player has no invite code, they are not holding an empty one.
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: When the table gathers next; null when unscheduled.
        progression:
          type: string
          enum:
            - milestone
            - xp
          description: How heroes advance at this table.
        maxLevel:
          type: integer
          nullable: true
          description: The DM's level ceiling for this table; null means the standard 20.
        requireSeatingApproval:
          type: boolean
          description: When true the door is barred — new heroes wait for the DM's approval before seating.
        maxSeatedPerPlayer:
          type: integer
          description: |
            How many heroes one player may seat at this table at once. The DM's dial; defaults to one. The cap holds the door — heroes already seated are never evicted by lowering it.
        coinage:
          type: array
          nullable: true
          description: The coins this table counts in, smallest first (#195). Null means the standard cp/sp/ep/gp/pp ladder, which is what every campaign had before a DM could say otherwise. A purse and a price are both reckoned in the smallest coin's units.
          items:
            $ref: "#/components/schemas/Coin"
        hiddenSheets:
          type: boolean
          description: |
            When true the veil is drawn over the table's character sheets: a player sees only the names of the other heroes. Owners and the DM always read their own sheets in full, and the DM may lift the veil on individual heroes.
    Coin:
      type: object
      required:
        - name
        - abbrev
        - value
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: What the coin is called — "Glimmer", "Trade Bar", "Gold Pieces".
        abbrev:
          type: string
          minLength: 1
          maxLength: 8
          description: "What a price writes it as: \"3 glm\". Letters only, unique within the ladder, and matched case-insensitively."
        value:
          type: integer
          minimum: 1
          description: What one is worth in base units. The smallest coin is 1 by definition, so a ladder always has one rung worth exactly that.
    SetCoinageRequest:
      type: object
      required:
        - coins
      properties:
        coins:
          type: array
          description: The ladder, in any order — it is sorted on the way in. An empty list puts the table back on the standard coins.
          maxItems: 8
          items:
            $ref: "#/components/schemas/Coin"
    CampaignMembership:
      type: object
      required:
        - campaign
        - role
      properties:
        campaign:
          $ref: "#/components/schemas/Campaign"
        role:
          $ref: "#/components/schemas/Role"
    Member:
      type: object
      required:
        - userId
        - name
        - role
        - joinedAt
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    Ban:
      type: object
      required:
        - userId
        - name
        - bannedAt
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
          nullable: true
        bannedAt:
          type: string
          format: date-time
    BanRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    PendingSeat:
      type: object
      required:
        - characterId
        - name
        - level
        - ownerName
        - requestedAt
      properties:
        characterId:
          type: string
          format: uuid
        name:
          type: string
        class:
          type: string
          nullable: true
        level:
          type: integer
        ownerName:
          type: string
          description: Display name of the player who knocks.
        requestedAt:
          type: string
          format: date-time
    SeatPending:
      type: object
      required:
        - campaignId
        - campaignName
      properties:
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
    MySeatRequest:
      type: object
      required:
        - characterId
        - campaignId
        - campaignName
      properties:
        characterId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
    CurrentUser:
      type: object
      required:
        - user
        - campaigns
      properties:
        user:
          $ref: "#/components/schemas/User"
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/CampaignMembership"
    CreateCampaignRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        realmId:
          type: string
          format: uuid
          description: "Found this campaign in a realm you already have. Omitted — the default, and what every table did before #233 — it gets a realm of its own, named after the campaign."
    JoinCampaignRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
    SetNextSessionRequest:
      type: object
      properties:
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: Omit or send null to clear the scheduled session.
    QuestStatus:
      type: string
      enum:
        - available
        - active
        - completed
        - failed
    QuestDifficulty:
      type: string
      enum:
        - trivial
        - easy
        - medium
        - hard
        - deadly
    RewardType:
      type: string
      enum:
        - gold
        - item
        - xp
        - reputation
        - other
    QuestReward:
      type: object
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/RewardType"
        label:
          type: string
        value:
          type: string
          nullable: true
    QuestClaim:
      type: object
      required:
        - userId
        - userName
        - claimedAt
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        heroName:
          type: string
          description: The claimant's seated hero(es) at this table, when they have any — the name the board prefers to speak.
        claimedAt:
          type: string
          format: date-time
    Quest:
      type: object
      required:
        - id
        - campaignId
        - title
        - description
        - difficulty
        - status
        - createdAt
        - rewards
        - claims
        - claimedByMe
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        giver:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          description: Display name of the place this notice hangs in.
        locationId:
          type: string
          format: uuid
          nullable: true
        visibleToParty:
          type: boolean
          description: DM-only. The party-wide veil on this notice.
        hiddenByLocation:
          type: boolean
          description: DM-only. True when the place this notice hangs in (or one above it) is still veiled, so the notice stays off the players' board however it is set.
        visibility:
          type: array
          description: DM-only. Per-hero exceptions to visibleToParty.
          items:
            $ref: "#/components/schemas/VisibilityOverride"
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        status:
          $ref: "#/components/schemas/QuestStatus"
        createdAt:
          type: string
          format: date-time
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/QuestReward"
        claims:
          type: array
          items:
            $ref: "#/components/schemas/QuestClaim"
        claimedByMe:
          type: boolean
    Character:
      type: object
      required:
        - id
        - ownerUserId
        - ownerName
        - name
        - class
        - level
        - hpCurrent
        - hpMax
        - createdAt
        - mine
        - tableBorn
        - kind
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: The campaign this hero is seated at; null while in My Heroes.
        campaignName:
          type: string
          nullable: true
          description: Name of the seated campaign, when known.
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
          description: Display name of the member who plays this character.
        name:
          type: string
        class:
          type: string
          description: Freeform class/ancestry line, e.g. "Half-Elf Bard".
        hitDice:
          type: array
          description: |
            Hit dice by die type, already resolved: the maximum from the hero's class levels, used from what they have spent. Pooled per die, because a level 5 Cleric / level 5 Paladin has five d8 and five d10 and spending one must not consume the other (PHB 2024, p.44). A hero with no class content has their level in d8.
          items:
            $ref: "#/components/schemas/HitDicePool"
        level:
          type: integer
        hpCurrent:
          type: integer
        hpMax:
          type: integer
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: True when the caller owns this character.
        kind:
          type: string
          enum:
            - hero
            - npc
          description: |
            What this sheet is. `hero` is somebody's character, seated or on their shelf. `npc` is a body (#227) — a sheet forged for one of the Folk on the Folk page: never on a roster, never counted, and read through that person's veils rather than the table's sheet veil (#267).
        tableBorn:
          type: boolean
          description: |
            Born of a quick-add on a campaign roster: lives and dies with the table, never listed in My Heroes, never seated elsewhere. Account heroes are the opposite — the roster may only unseat them.
        partyId:
          type: string
          format: uuid
          nullable: true
          description: "The party this hero rides with (#232), or null for one who rides with none yet. Nothing is gated on it: it decides how the roster groups and who a party-wide grant paints, never what this hero may see."
        partyName:
          type: string
          nullable: true
        xp:
          type: integer
          description: Experience points (XP-mode campaigns; advisory).
        pendingLevels:
          type: integer
          description: Milestone level-ups waiting to be taken.
        pregen:
          type: boolean
          description: |
            True when this hero was offered as a pre-made pregen (#180) — either waiting in a one-shot's pool (owned by the DM who offered it) or claimed and now played by a member. Lets the roster mark a claimed pregen and offer to release it back to the pool.
        concealed:
          type: boolean
          description: |
            True when the table's veil hides this hero from the caller. Only the name (and who plays them) is real — class, level, HP and the sheet come back emptied, and the full sheet is refused.
        revealed:
          type: boolean
          description: |
            True when the DM has lifted the veil on this hero, so the party reads their sheet even while the table's sheets are veiled. Only meaningful on a veiled table.
        sheet:
          $ref: "#/components/schemas/CharacterSheet"
    CharacterClass:
      type: object
      required:
        - classId
        - className
        - level
      description: |
        One class a hero holds levels in. A Rogue 5 / Wizard 3 has two of these,
        each with its own subclass — a roguish archetype and an arcane tradition
        are not interchangeable, so the subclass belongs to the class rather than
        to the hero.
      properties:
        classId:
          type: string
          format: uuid
        className:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 20
          description: Levels in THIS class, not the hero's total.
        subclassId:
          type: string
          format: uuid
          nullable: true
        subclassName:
          type: string
          nullable: true
        starting:
          type: boolean
          description: True for the class the hero began as — the one granting full starting proficiencies.
    Spellcaster:
      type: object
      required:
        - classId
        - className
        - ability
        - spellIds
      description: |
        One class a hero casts from. A Ranger 4 / Sorcerer 3 has two: they prepare
        for each "as if you were a single-classed member of that class", and each
        spell is cast off the ability of the class it belongs to (PHB 2024, p.44).
      properties:
        classId:
          type: string
          format: uuid
        className:
          type: string
        ability:
          type: string
          description: STR…CHA — what this class's spells are cast off.
        cantripsKnown:
          type: integer
          description: How many cantrips this class allows at the hero's level in it.
        prepared:
          type: integer
          description: How many levelled spells this class allows at the hero's level in it.
        maxSpellLevel:
          type: integer
          description: |
            The highest spell level this class may PREPARE, from its own level. Slots can be higher than this — the shared pool may hand a Ranger 4 / Sorcerer 3 a level 3 slot they have no level 3 spell to put in it.
        spellIds:
          type: array
          description: The hero's spells belonging to this class.
          items:
            type: string
            format: uuid
    CharacterSheet:
      type: object
      description: Present only on wizard-forged heroes.
      required:
        - abilities
        - skills
      properties:
        abilities:
          $ref: "#/components/schemas/AbilityScores"
        skills:
          type: array
          items:
            type: string
        classId:
          type: string
          format: uuid
          nullable: true
          description: |
            The class this hero *started* as — the one they take full starting proficiencies from (PHB 2024, p.44). For everything level-related see `classes`, which is the whole list; this is not a copy of its first entry, it is a different fact that happens to agree on day one.
        speciesId:
          type: string
          format: uuid
          nullable: true
        backgroundId:
          type: string
          format: uuid
          nullable: true
        subclassId:
          type: string
          format: uuid
          nullable: true
          description: The starting class's subclass. Per-class subclasses are in `classes`.
        classes:
          type: array
          description: |
            Every class this hero holds levels in, starting class first. Their levels sum to `level`. Empty for a quick-add hero, who has a freeform `class` line and no content behind it.
          items:
            $ref: "#/components/schemas/CharacterClass"
        feats:
          type: array
          items:
            type: string
        speciesChoices:
          $ref: "#/components/schemas/SpeciesChoices"
          description: The species picks made at creation, keyed by choice id.
        spellcastingAbility:
          type: string
          description: Present on casters (STR…CHA).
        spellSlots:
          type: array
          description: |
            Present on casters — max and used per spell level. For a hero casting from more than one class this is the shared pool off the Multiclass Spellcaster table, read at their combined caster level (PHB 2024, p.44). Pact Magic is not in here; see `pactSlots`.
          items:
            $ref: "#/components/schemas/SpellSlot"
        pactSlots:
          $ref: "#/components/schemas/SpellSlot"
          description: |
            Pact Magic, which is its own pool: N slots all at one level, back on a short rest. Absent unless the hero has Warlock levels. Either pool may cast the other's prepared spells, but they are never added together.
        pools:
          type: array
          description: "The hero's resource pools — Rages, Channel Divinity, Focus Points — already resolved: max computed from the granting content and the hero's level, used read from what they have spent."
          items:
            $ref: "#/components/schemas/ResourcePool"
    SpeciesChoices:
      type: object
      description: Species picks keyed by the choice id declared in the species entry's data, each holding the chosen option names.
      additionalProperties:
        type: array
        items:
          type: string
    SpellSlot:
      type: object
      required:
        - level
        - max
        - used
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 9
        max:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
    AbilityScores:
      type: object
      required:
        - str
        - dex
        - con
        - int
        - wis
        - cha
      properties:
        str:
          type: integer
          minimum: 3
          maximum: 30
        dex:
          type: integer
          minimum: 3
          maximum: 30
        con:
          type: integer
          minimum: 3
          maximum: 30
        int:
          type: integer
          minimum: 3
          maximum: 30
        wis:
          type: integer
          minimum: 3
          maximum: 30
        cha:
          type: integer
          minimum: 3
          maximum: 30
    ForgeRequest:
      type: object
      required:
        - name
        - classId
        - speciesId
        - backgroundId
        - abilities
        - skills
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        classId:
          type: string
          format: uuid
        speciesId:
          type: string
          format: uuid
        backgroundId:
          type: string
          format: uuid
        abilities:
          $ref: "#/components/schemas/AbilityScores"
          description: Final scores, background bonuses already applied.
        skills:
          type: array
          items:
            type: string
          description: Chosen class skills (background skills are implied).
        spells:
          type: array
          items:
            type: string
            format: uuid
          description: Level-1 spell picks (casters only; cantrips included).
        gear:
          type: string
          maxLength: 1
          description: "Starting-equipment option label (A/B/C) from the class's startingEquipment data. The server stocks the inventory: listed items (linked to armory content where names match), gold as a Gold Pieces row, plus the background's equipment items."
        speciesChoices:
          $ref: "#/components/schemas/SpeciesChoices"
          description: One entry per choice the species offers, keyed by choice id — an Elf's lineage, a Gnome's Forest-or-Rock, a Human's free skill and Origin feat. Every offered choice must be answered.
    CharacterInput:
      type: object
      required:
        - name
        - level
        - hpCurrent
        - hpMax
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        class:
          type: string
          maxLength: 80
        level:
          type: integer
          minimum: 1
          maximum: 20
        hpCurrent:
          type: integer
          minimum: 0
        hpMax:
          type: integer
          minimum: 1
    SeatRequest:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: Omit or null to unseat the hero back to My Heroes.
    PregenOffer:
      type: object
      required:
        - characterId
      properties:
        characterId:
          type: string
          format: uuid
          description: One of the DM's own unseated heroes to offer into this campaign's pregen pool (#180).
    RulesContent:
      type: object
      required:
        - id
        - kind
        - source
        - name
        - summary
        - data
        - mine
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - class
            - species
            - background
            - subclass
            - feat
            - spell
            - item
            - monster
            - rule
        source:
          type: string
          enum:
            - srd
            - homebrew
        name:
          type: string
        summary:
          type: string
        data:
          type: object
          description: Kind-specific payload (hit die, traits, features…).
          additionalProperties: true
        mine:
          type: boolean
          description: True when the caller authored this homebrew entry.
        creatorName:
          type: string
          nullable: true
          description: Author of a homebrew entry; null for SRD content.
    RulesContentInput:
      type: object
      required:
        - name
        - summary
        - data
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 300
        data:
          type: object
          additionalProperties: true
    RestRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - long
            - short
        hitDice:
          type: object
          description: |
            Short rest only: how many hit dice to spend healing, keyed by die size ("10": 2). A map rather than a count because a multiclassed hero holds more than one kind and may spend any mix of them — and because it has to be one request: a short rest also restores pact slots and pools, so taking two rests to spend two kinds of die would hand those back twice. Ignored on a long rest, which spends none.
          additionalProperties:
            type: integer
            minimum: 0
    RestReport:
      type: object
      required:
        - character
        - kind
        - hpRestored
        - hitDiceSpent
        - hitDiceRegained
        - hitDiceLeft
        - slotsRestored
        - rolls
        - canSwapSpells
        - poolsRestored
      properties:
        character:
          $ref: "#/components/schemas/Character"
        kind:
          type: string
        hpRestored:
          type: integer
          description: Hit points actually regained — 0 when the hero was already whole.
        hitDiceSpent:
          type: integer
        hitDiceRegained:
          type: integer
        hitDiceLeft:
          type: integer
          description: Hit dice still available to spend after this rest.
        slotsRestored:
          type: boolean
          description: Whether spell slots came back. Always on a long rest; on a short rest only for a pact caster, whose slots are the ones that return.
        rolls:
          type: array
          description: What each spent hit die rolled, before the CON modifier.
          items:
            type: integer
        canSwapSpells:
          type: boolean
          description: Whether this hero's class may change its prepared spells now — the long-rest trigger the spell swap has been waiting for.
        poolsRestored:
          type: array
          description: Names of the resource pools this rest gave uses back to — empty when none moved, or the hero has none.
          items:
            type: string
    SpellSwap:
      type: object
      description: One spell traded for another; both must be the same kind (cantrip for cantrip).
      required:
        - replace
        - with
      properties:
        replace:
          type: string
          format: uuid
          description: A spell the hero currently knows.
        with:
          type: string
          format: uuid
          description: Its replacement, legal for the class and the hero's level.
    SpellSwapRequest:
      type: object
      required:
        - swaps
      properties:
        swaps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SpellSwap"
    HitDicePool:
      type: object
      required:
        - die
        - max
        - used
      properties:
        die:
          type: integer
          description: The die size — 6, 8, 10 or 12.
        max:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
    LevelUpRequest:
      type: object
      required:
        - hpMode
      properties:
        classId:
          type: string
          format: uuid
          description: |
            Which class takes the level. Omit to advance the hero's only class; required once they hold more than one. Naming a class they do not yet have is how a hero multiclasses, and is refused unless they meet its prerequisite — 13+ in the primary ability of the new class and of every class they already hold (PHB 2024, p.44).
        hpMode:
          type: string
          enum:
            - average
            - roll
        hpRoll:
          type: integer
          minimum: 1
          maximum: 12
          description: The hit-die result when hpMode is roll.
        subclassId:
          type: string
          format: uuid
          description: Required when the new level is the class's subclass level.
        featId:
          type: string
          format: uuid
          description: Take a feat instead of ability increases at an ASI level.
        spells:
          type: array
          items:
            type: string
            format: uuid
          description: New spell picks gained with this level (casters only).
        spellSwaps:
          type: array
          items:
            $ref: "#/components/schemas/SpellSwap"
          description: Spells traded on gaining this level, for classes whose spellChanges rule says level-up (Bard, Sorcerer, Warlock).
        asi:
          type: object
          description: Ability increases at an ASI level; total of 2 points, each +1 or +2.
          additionalProperties: false
          properties:
            str:
              type: integer
              minimum: 1
              maximum: 2
            dex:
              type: integer
              minimum: 1
              maximum: 2
            con:
              type: integer
              minimum: 1
              maximum: 2
            int:
              type: integer
              minimum: 1
              maximum: 2
            wis:
              type: integer
              minimum: 1
              maximum: 2
            cha:
              type: integer
              minimum: 1
              maximum: 2
    CodexEntry:
      type: object
      required:
        - content
        - status
      properties:
        content:
          $ref: "#/components/schemas/RulesContent"
        status:
          type: string
          enum:
            - proposed
            - enabled
            - banned
        proposerName:
          type: string
          nullable: true
    SeatConflict:
      type: object
      required:
        - error
        - missing
      properties:
        error:
          type: string
        missing:
          type: array
          description: Content the hero uses that the codex has not admitted.
          items:
            type: object
            required:
              - id
              - kind
              - name
              - state
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
              name:
                type: string
              state:
                type: string
                enum:
                  - absent
                  - proposed
                  - banned
                description: absent = never offered; proposed = awaiting the DM; banned = the DM said no.
    SpellSlotsInput:
      type: object
      required:
        - used
      properties:
        used:
          type: array
          maxItems: 9
          items:
            type: integer
            minimum: 0
          description: |
            Slots spent per spell level (index 0 = level 1) in the shared pool. Pact Magic is counted apart — see `pactUsed`.
        pactUsed:
          type: integer
          minimum: 0
          description: |
            Pact Magic slots spent. Its own count because the two pools never merge: a Warlock 3 / Wizard 3 spending a pact slot must not show a Wizard slot gone (PHB 2024, p.44). Omit to leave it as it was.
    ResourcePool:
      type: object
      required:
        - name
        - max
        - used
        - grantedBy
        - shortRest
      properties:
        name:
          type: string
          description: The pool's name as the granting content declares it — "Rages".
        max:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        grantedBy:
          type: string
          description: Name of the content entry that grants this pool — "Barbarian".
        shortRest:
          type: string
          enum:
            - none
            - one
            - all
          description: What a short rest gives back — nothing, one use, or everything. A long rest always refills the pool.
    PoolsInput:
      type: object
      required:
        - used
      properties:
        used:
          type: object
          description: Uses spent per pool, keyed by pool name. The map is the whole state — a pool missing from it is unspent.
          additionalProperties:
            type: integer
            minimum: 0
    InventoryItem:
      type: object
      required:
        - id
        - name
        - qty
        - equipped
        - attuned
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        qty:
          type: integer
          description: How many. For the purse (#195) this is the hero's coin in BASE units — the campaign's smallest denomination — which is what lets it be broken back into coins for display.
        isPurse:
          type: boolean
          description: True for the one row that is the hero's coin. It used to be inferred from the name "Gold Pieces" in four places at once, a rule that stopped being true the moment a DM renamed their currency (#195).
        equipped:
          type: boolean
        attuned:
          type: boolean
          description: "Whether this row holds one of the hero's three attunements. Per row regardless of qty — the same way a stack equipped in a hand fights as one weapon — and independent of equipped: stowing a ring does not break the bond."
        slot:
          type: string
          enum:
            - ""
            - armor
            - mainhand
            - offhand
            - bothhands
            - cloak
            - amulet
            - helm
            - belt
            - boots
            - gloves
            - bracers
            - ring1
            - ring2
          description: Where an equipped item sits; empty when stowed. `bothhands` is a two-handed grip — it occupies main and off hand at once, and a versatile weapon held so rolls its bigger die. Beyond the battle slots, an item whose data declares a `wear` kind occupies the matching worn slot (rings get two).
        content:
          $ref: "#/components/schemas/RulesContent"
          nullable: true
          description: The rules entry behind this row; null for free-text gear.
    InventoryItemInput:
      type: object
      properties:
        contentId:
          type: string
          format: uuid
          description: An item from the library — or omit and use name for free-text gear.
        name:
          type: string
          maxLength: 80
        qty:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
    InventoryItemPatch:
      type: object
      properties:
        qty:
          type: integer
          minimum: 1
          maximum: 1000000
        equipped:
          type: boolean
        slot:
          type: string
          enum:
            - armor
            - mainhand
            - offhand
            - bothhands
            - cloak
            - amulet
            - helm
            - belt
            - boots
            - gloves
            - bracers
            - ring1
            - ring2
          description: Equip into a specific slot (implies equipped). Armor only fits the armor slot, shields only the off-hand; a one-handed weapon fits either hand; a Two-Handed weapon only `bothhands`, and a Versatile one may take `bothhands` for its bigger die; a worn item (its data declares `wear`) fits only its own kind's slot — rings either ring slot. A two-handed grip displaces whatever either hand held. Displaced occupants are unequipped in the same stroke. Use equipped:false to stow.
        attuned:
          type: boolean
          description: Form or break the bond. Only a library item whose data declares `attunement` can attune, and three attuned rows are the most a hero can hold; false always succeeds. Independent of equipped.
    CharacterDetail:
      type: object
      required:
        - character
        - spells
        - items
        - creatures
      properties:
        character:
          $ref: "#/components/schemas/Character"
        spells:
          type: array
          items:
            $ref: "#/components/schemas/RulesContent"
        casters:
          type: array
          description: |
            The classes this hero casts from, and which of their spells belong to each. Absent for a non-caster. Additive to `spells`, which stays the flat list every surface already reads.
          items:
            $ref: "#/components/schemas/Spellcaster"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        creatures:
          type: array
          description: The hero's second stat blocks — forms they take and companions that fight beside them — already resolved, so the sheet needs no second round trip and players need no reach into the Den.
          items:
            $ref: "#/components/schemas/CharacterCreature"
    CreatureRole:
      type: string
      enum:
        - form
        - companion
        - summon
      description: What the second stat block is to the hero. A `form` replaces their statistics while keeping their hit points (Wild Shape); a `companion` is a separate creature with its own pool that stays between sessions (a Steel Defender, a familiar, a steed); a `summon` is the same but temporary.
    CharacterCreature:
      type: object
      required:
        - id
        - role
        - name
        - active
        - block
        - molded
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CreatureRole"
        name:
          type: string
          description: The player's name for it — a wolf companion is somebody's Grey.
        grantedBy:
          type: string
          description: The feature that granted it, for the stamp on the sheet.
        active:
          type: boolean
          description: Currently shaped into, or currently on the field.
        hpCurrent:
          type: integer
          nullable: true
          description: Damage tracked against `hpMax`. Null on a form, which has no pool of its own — in a form the hero keeps their own hit points and gains temporary ones instead.
        hpMax:
          type: integer
          nullable: true
          description: "Read-only, and read off the resolved block rather than stored: a companion whose pool is \"five times your level\" has to grow when the hero does. Houserule it by overriding `hp` like any other field."
        notes:
          type: string
        contentId:
          type: string
          format: uuid
          nullable: true
          description: The library stat block behind it; null for one written by hand.
        blockSource:
          type: string
          enum:
            - srd
            - homebrew
            - custom
          description: Where the numbers came from. `custom` means there is no library entry.
        block:
          type: object
          additionalProperties: true
          description: "The stat block as played: the library entry, with any `scale` expressions on it evaluated against this hero, with the player's overrides applied on top."
        molded:
          type: array
          items:
            type: string
          description: Which fields the player has set by hand. Everything else still tracks the library entry and re-scales when the hero levels.
        overrides:
          type: object
          additionalProperties: true
          description: "The molded values themselves, unmerged. An editor needs these: `block` cannot tell a hand-set number from the book's, so building a patch from it would silently un-mold every field the player did not retype."
        tempHp:
          type: integer
          nullable: true
          description: Temporary hit points assuming this form grants, when the granting feature declares them. Forms only.
    CreatureInput:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/CreatureRole"
        contentId:
          type: string
          format: uuid
          description: A stat block from the library. Omit and supply a name to write one by hand instead. A player may only draw on blocks their own features grant; a DM may draw on any the campaign admits.
        name:
          type: string
          maxLength: 80
          description: Defaults to the library entry's name.
        grantedBy:
          type: string
          maxLength: 80
        overrides:
          type: object
          additionalProperties: true
          description: Fields to mold from the outset.
        notes:
          type: string
          maxLength: 2000
    CreaturePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        overrides:
          type: object
          additionalProperties: true
          description: Replaces the whole override map, so removing a field un-molds it and hands that number back to the library entry.
        hpCurrent:
          type: integer
          minimum: 0
          description: Where the creature stands now, clamped to the block's hit points. The maximum is not settable here — override `hp` to change it.
        active:
          type: boolean
          description: Assuming a form drops any other form the hero is holding — one shape at a time. Companions and summons are independent of each other.
        notes:
          type: string
          maxLength: 2000
    CreatureOption:
      type: object
      required:
        - name
        - role
        - block
      properties:
        contentId:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        role:
          $ref: "#/components/schemas/CreatureRole"
        grantedBy:
          type: string
          description: The feature offering it.
        block:
          type: object
          additionalProperties: true
          description: Resolved for this hero, so the picker previews real numbers.
    FormAllowance:
      type: object
      required:
        - feature
        - known
        - maxCR
        - fly
        - tempHp
        - options
      properties:
        feature:
          type: string
          description: The feature granting the forms, e.g. "Wild Shape".
        creatureType:
          type: string
          description: The creature type forms are drawn from, e.g. "Beast".
        known:
          type: integer
          description: How many forms the hero may know at their level.
        maxCR:
          type: number
          description: The Challenge Rating ceiling at their level.
        fly:
          type: boolean
          description: Whether a form with a Fly Speed is allowed yet.
        tempHp:
          type: integer
          description: Temporary hit points assuming a form grants.
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreatureOption"
    CreatureOptions:
      type: object
      required:
        - forms
        - companions
      description: What this hero's features actually grant. This is the only way a player reaches monster stat blocks — the Den stays a DM room, and this is narrowed to the creatures their own sheet entitles them to.
      properties:
        forms:
          type: array
          items:
            $ref: "#/components/schemas/FormAllowance"
        companions:
          type: array
          items:
            $ref: "#/components/schemas/CreatureOption"
    Vendor:
      type: object
      required:
        - id
        - name
        - description
        - revealed
        - stock
        - isDM
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        locationId:
          type: string
          format: uuid
          nullable: true
        locationName:
          type: string
          nullable: true
          description: The place this shop trades in — null when it is filed nowhere.
        revealed:
          type: boolean
          description: Whether the party has met this shop. Players are only ever sent revealed shops, so for them this is always true; the DM sees it as a switch.
        stock:
          type: array
          items:
            $ref: "#/components/schemas/VendorStock"
        isDM:
          type: boolean
          description: Whether the viewer may edit this shop and reveal its shelves.
    VendorStock:
      type: object
      required:
        - id
        - name
        - price
        - revealed
      properties:
        id:
          type: string
          format: uuid
        contentId:
          type: string
          format: uuid
          nullable: true
          description: The armory entry behind this line; null for a written-in line.
        name:
          type: string
        price:
          type: string
          description: What this trader asks — a shop marks up, so it is not the item's own cost.
        qty:
          type: integer
          nullable: true
          description: How many are in stock; null is "as many as you like".
        revealed:
          type: boolean
        item:
          $ref: "#/components/schemas/RulesContent"
          nullable: true
          description: The armory entry, so a player can read what they are being offered.
    VendorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        locationId:
          type: string
          format: uuid
          nullable: true
        revealed:
          type: boolean
    StockInput:
      type: object
      properties:
        contentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: Required for a written-in line; taken from the armory entry otherwise.
        price:
          type: string
        qty:
          type: integer
          nullable: true
    StockPatch:
      type: object
      properties:
        price:
          type: string
        qty:
          type: integer
          nullable: true
        revealed:
          type: boolean
    BuyRequest:
      type: object
      required:
        - characterId
      properties:
        characterId:
          type: string
          format: uuid
          description: The seated hero doing the buying — the coin and the goods are theirs.
    BuyReceipt:
      type: object
      required:
        - vendor
        - paidGp
        - goldRemaining
      properties:
        vendor:
          $ref: "#/components/schemas/Vendor"
          description: The shop after the sale, as this viewer may see it.
        paidGp:
          type: integer
          description: What was charged, in whole gold — sub-gp prices round up to the shopkeeper's favor.
        goldRemaining:
          type: integer
          description: Gold left in the hero's purse; 0 when the purchase emptied it.
    BestiaryNote:
      type: object
      required:
        - id
        - body
        - mine
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        authorName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: Whether the viewer penned this note.
    CampaignMap:
      type: object
      required:
        - id
        - campaignId
        - name
        - fogEnabled
        - width
        - height
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        parentMapId:
          type: string
          format: uuid
          nullable: true
          description: The map this one details; null for an overworld.
        name:
          type: string
        fogEnabled:
          type: boolean
          description: When true, players see only what their reveal circles uncover.
        width:
          type: integer
          description: Pixel width of the stored image.
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this map depicts, when it depicts one (#229).
        locationName:
          type: string
          nullable: true
        visibleToParty:
          type: boolean
          description: Whether the whole table may know this map exists (#276). Absent from a player's payload — a veiled map never reaches them at all, and the state of the veil is the DM's business.
        visibilityOverrides:
          type: array
          description: "Heroes singled out against the party-wide flag. DM only, like the invite code: absent rather than empty for a player."
          items:
            $ref: "#/components/schemas/VisibilityOverride"
    MapPin:
      type: object
      required:
        - id
        - mapId
        - label
        - note
        - x
        - "y"
        - dmOnly
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        label:
          type: string
        note:
          type: string
        x:
          type: number
          description: Fraction of the image width, 0..1.
        "y":
          type: number
          description: Fraction of the image height, 0..1.
        dmOnly:
          type: boolean
        shape:
          type: string
          enum:
            - pin
            - circle
            - square
            - diamond
            - triangle
            - star
            - cross
            - skull
          description: What the marker looks like (#262). `pin` is the teardrop every pin was before shapes existed, and remains the default.
        linkMapId:
          type: string
          format: uuid
          nullable: true
          description: When set, this pin is a region marker leading into that sub-map.
        createdAt:
          type: string
          format: date-time
    MapPoint:
      type: object
      required:
        - x
        - "y"
      properties:
        x:
          type: number
          description: Fraction of the image width, 0..1.
        "y":
          type: number
          description: Fraction of the image height, 0..1.
    MapShape:
      type: object
      required:
        - id
        - mapId
        - kind
        - label
        - points
        - color
        - dashed
        - width
        - opacity
        - dmOnly
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - line
            - area
          description: "`line` is stroked along its points — a road, a street, a river. `area` is filled between them — a kingdom, a district, a region. The two are one table because they are one gesture (#262)."
        label:
          type: string
        points:
          type: array
          description: The run of points, in order, as fractions of the image — the same normalisation a pin's x/y uses, so a shape survives the map being re-hung at another size. An `area` closes itself; the first point is not repeated at the end.
          items:
            $ref: "#/components/schemas/MapPoint"
        color:
          type: string
          description: "#rrggbb — the stroke of a line, the fill of an area."
        dashed:
          type: boolean
        width:
          type: number
          description: "Stroke width as a fraction of the image width, so it scales with the map: a width in pixels would be a hair on one map and a river on another."
        opacity:
          type: number
          description: Fill opacity for an area, 0..1. Ignored by a line.
        dmOnly:
          type: boolean
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this shape depicts, if any. Tint Barovia, and clicking it opens Barovia. Losing the place dims the link, never the drawing.
        locationName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    MapShapeInput:
      type: object
      required:
        - kind
        - points
      properties:
        kind:
          type: string
          enum:
            - line
            - area
        label:
          type: string
          maxLength: 80
        points:
          type: array
          items:
            $ref: "#/components/schemas/MapPoint"
        color:
          type: string
        dashed:
          type: boolean
        width:
          type: number
        opacity:
          type: number
        dmOnly:
          type: boolean
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The nil UUID detaches the place, as everywhere else in this API.
    MapDetail:
      type: object
      required:
        - map
        - pins
        - shapes
        - revealed
      properties:
        map:
          $ref: "#/components/schemas/CampaignMap"
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
        shapes:
          type: array
          description: |
            Roads and regions drawn on this map (#262), filtered for the caller exactly as pins are: a DM-only shape is absent from a player's payload, and under fog a line comes back clipped to the stretches standing on ground they have uncovered.
          items:
            $ref: "#/components/schemas/MapShape"
        revealed:
          type: array
          description: |
            The caller's uncovered area — every circle for the DM; for a player, every circle stamped for the whole table plus every circle stamped while one of their own heroes stood in the party (#232). Empty when fog is off.
          items:
            $ref: "#/components/schemas/RevealCircle"
    RevealCircle:
      type: object
      required:
        - x
        - "y"
        - r
      properties:
        x:
          type: number
          description: Fraction of the image width, 0..1.
        "y":
          type: number
          description: Fraction of the image height, 0..1.
        r:
          type: number
          description: Radius as a fraction of the image width.
    SubmitRevealsRequest:
      type: object
      required:
        - circles
      properties:
        note:
          type: string
          description: Optional label for the ledger ("session 12 — the road east").
        locationId:
          type: string
          format: uuid
          nullable: true
          description: |
            Tie this batch to a place. Its ground then lifts only for a hero the place's veil already admits — which is how a player who grew up in a city starts knowing it. Omit for a batch nothing further gates.
        partyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Stamp this for one party rather than the whole table (#232). The heroes riding with it *at this moment* are recorded on the batch, so the ground belongs to them from then on — moving between parties never takes it away, and joining one never hands it over.
        circles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RevealCircle"
    SetRevealLocationRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place gating this batch; null cuts it loose again.
    RevealBatch:
      type: object
      required:
        - id
        - note
        - partyName
        - heroCount
        - circles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        partyName:
          type: string
          description: The party this was stamped for, as a label for the ledger only — empty when it was stamped for the whole table, and empty again if that party is later disbanded. What the ground is actually gated on is the heroes recorded below, never the party (#232).
        heroCount:
          type: integer
          description: "How many heroes were standing in that party when the stamp was made. Zero means the whole table. This is the gate: a hero who moves to another party keeps the ground they walked, and one who joins later does not inherit it."
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place whose veil gates this batch; absent when none does.
        locationName:
          type: string
          description: Name of that place, for the ledger. Empty when there is none.
        circles:
          type: integer
          description: How many circles the batch stamped.
        createdAt:
          type: string
          format: date-time
    CreateMapRequest:
      type: object
      required:
        - name
        - imageBase64
      properties:
        name:
          type: string
          minLength: 1
        imageBase64:
          type: string
          description: The image file, base64-encoded. JPEG or PNG, up to 10 MB decoded.
        parentMapId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: The place this map depicts, when it depicts one (#229).
          nullable: true
        visibleToParty:
          type: boolean
          description: Whether the table may see it straight away. Defaults to false — a map is the DM's until they hang it in the hall (#276).
    UpdateMapRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        parentMapId:
          type: string
          format: uuid
          nullable: true
        fogEnabled:
          type: boolean
          description: Omit to leave the fog as it is.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this map depicts. Omitted means unchanged — like a shop, a map cannot be quietly unfiled by a request that says nothing.
    MapPinInput:
      type: object
      required:
        - label
        - x
        - "y"
      properties:
        label:
          type: string
          minLength: 1
        note:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 1
        "y":
          type: number
          minimum: 0
          maximum: 1
        dmOnly:
          type: boolean
        shape:
          type: string
          enum:
            - pin
            - circle
            - square
            - diamond
            - triangle
            - star
            - cross
            - skull
          description: What the marker looks like (#262). `pin` is the teardrop every pin was before shapes existed, and remains the default.
        linkMapId:
          type: string
          format: uuid
          nullable: true
    Encounter:
      type: object
      required:
        - id
        - campaignId
        - name
        - status
        - round
        - turnIndex
        - combatantCount
        - tag
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        tag:
          type: string
          description: Free-text filing for the library — a session, an act, a chapter. Empty when the encounter is unfiled.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this fight is prepared for; null when it belongs nowhere in particular.
        locationName:
          type: string
          nullable: true
          description: Display name of that place, so the library needs no second lookup.
        status:
          type: string
          description: inactive | active (plain string, validated server-side).
        round:
          type: integer
        turnIndex:
          type: integer
          description: Index into the initiative order whose turn it is.
        combatantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    Combatant:
      type: object
      required:
        - id
        - encounterId
        - kind
        - name
        - initMod
        - hpState
        - hidden
        - current
        - sortOrder
        - conditions
      properties:
        current:
          type: boolean
          description: Whether it's this combatant's turn right now (false for all when a hidden enemy is acting).
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        kind:
          type: string
          description: monster | pc | ally | custom (plain string). An ally is one of the Folk walking with the party (#228) — party-side, like a pc.
        name:
          type: string
          description: The DM sees the true label; players see the reveal label ("Unknown" until named).
        playerLabel:
          type: string
          nullable: true
          description: DM-only — what players see for this combatant.
        contentId:
          type: string
          format: uuid
          nullable: true
          description: DM-only — the Den monster this was built from.
        characterId:
          type: string
          format: uuid
          nullable: true
          description: DM-only (or the viewer's own PC) — the seated character.
        npcId:
          type: string
          format: uuid
          nullable: true
          description: DM-only — the traveler this ally was called in from (#228). The builder reads it to stop offering someone already standing in the fight.
        initMod:
          type: integer
        initiative:
          type: integer
          nullable: true
          description: Order value; null until rolled or typed.
        hpCurrent:
          type: integer
          nullable: true
          description: DM, or the owner of a PC combatant. Omitted for players otherwise.
        hpMax:
          type: integer
          nullable: true
        ac:
          type: integer
          nullable: true
        hpState:
          type: string
          description: healthy | bloodied | down — the only HP cue players get for others.
        hidden:
          type: boolean
          description: DM-only flag; hidden combatants are omitted from player payloads entirely.
        isMine:
          type: boolean
          description: For a player, whether this is their own PC (they may roll its initiative and see its HP).
        sortOrder:
          type: integer
        groupId:
          type: string
          format: uuid
          nullable: true
          description: Set when this combatant is one of a mob added together. Everything sharing a groupId is consecutive in the list and acts on a single turn; the tracker collapses the run into one entry.
        conditions:
          type: array
          items:
            type: string
          description: What is riding on this combatant, by canonical name ("Poisoned", "Exhaustion 3"). Everyone sees these — a hidden combatant is dropped from a player's payload entirely, so anything they can see, they can see the state of. Always present; empty when nothing ails it.
        deathSaves:
          $ref: "#/components/schemas/DeathSaves"
    DeathSaves:
      type: object
      required:
        - successes
        - failures
      description: "A dying hero's tally, 0–3 each. Present only on `pc` combatants — monsters here die when their hit points do. Party-visible: the table watches a friend bleed out together. Reset automatically the moment the hero is healed above 0."
      properties:
        successes:
          type: integer
          minimum: 0
          maximum: 3
        failures:
          type: integer
          minimum: 0
          maximum: 3
    EncounterDetail:
      type: object
      required:
        - encounter
        - combatants
      properties:
        encounter:
          $ref: "#/components/schemas/Encounter"
        combatants:
          type: array
          items:
            $ref: "#/components/schemas/Combatant"
    CreateEncounterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        tag:
          type: string
          maxLength: 60
          description: File it under a session or an act as you prepare it.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place it is prepared for. Must belong to the same campaign.
    FileEncounterRequest:
      type: object
      description: "The filing an encounter should carry, in full. This is a replacement, not a patch: an omitted tag clears the tag, an omitted or null locationId unpins the place."
      properties:
        tag:
          type: string
          maxLength: 60
        locationId:
          type: string
          format: uuid
          nullable: true
    UpdateEncounterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          description: inactive | active. Setting active triggers the fight; several may run at once. Setting inactive stands it down — the party is released and initiative is cleared, while prepared monsters stay.
        round:
          type: integer
          minimum: 1
        turnIndex:
          type: integer
          minimum: 0
    AddCombatantRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          description: monster (needs contentId) | pc (needs characterId) | ally (needs npcId) | custom (typed).
        contentId:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
        npcId:
          type: string
          format: uuid
          description: One of the Folk who travels with the party (#228). Their snapshot is taken from whatever stands behind them, and their hit points mirror home for as long as the fight runs — so, like a hero, an ally may stand in only one active fight at a time.
        label:
          type: string
          description: Name for a custom line, or an override for a monster/PC.
        playerLabel:
          type: string
        hpMax:
          type: integer
        ac:
          type: integer
        initMod:
          type: integer
        hidden:
          type: boolean
        count:
          type: integer
          minimum: 1
          maximum: 12
          description: How many to add; omitted means 1. Above 1 they arrive as one GROUP — a single initiative, a single turn, numbered labels ("Skeleton 1"…) — while each keeps its own HP. Add one at a time instead if you want genuinely independent monsters. Ignored for kind=pc; a character can only be seated once.
    UpdateCombatantRequest:
      type: object
      properties:
        label:
          type: string
        playerLabel:
          type: string
        initiative:
          type: integer
          nullable: true
        hpCurrent:
          type: integer
        hpMax:
          type: integer
        ac:
          type: integer
        hidden:
          type: boolean
        conditions:
          type: array
          items:
            type: string
          description: "The conditions this combatant is under, in full — a replacement, not a patch, so an empty array clears them. Names are case-insensitive but closed: anything outside the vocabulary is a 400 rather than a chip nobody can filter on later."
        deathSaveSuccesses:
          type: integer
          minimum: 0
          maximum: 3
          description: Death-save pips, settable only on a `pc` that is at 0 hit points — the only state in which they mean anything. Healing above 0 clears both tallies on its own.
        deathSaveFailures:
          type: integer
          minimum: 0
          maximum: 3
    BestiaryEntry:

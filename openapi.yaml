# GENERATED by npm run gen:bundle — edit openapi/ instead, then `make generate`.
openapi: 3.0.3
info:
  title: Quest Board API
  version: 0.1.0
  description: |
    Self-hosted D&D campaign helper. This spec is the single source of truth for
    the API contract: the Go server interface and the TypeScript client are both
    generated from it (`make generate`).
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness / readiness probe
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getCurrentUser
      summary: The currently authenticated user and their campaign memberships
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /campaigns:
    get:
      operationId: listCampaigns
      summary: Campaigns the current user belongs to
      responses:
        "200":
          description: List of campaigns with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      summary: Create a campaign (caller becomes its DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /campaigns/join:
    post:
      operationId: joinCampaign
      summary: Join a campaign as a player using its invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCampaignRequest"
      responses:
        "200":
          description: The joined campaign with the caller's role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    delete:
      operationId: deleteCampaign
      summary: Permanently delete a campaign (DM only)
      description: |
        Strikes the campaign for good: quests, the chronicle, codex rulings, maps, encounters, memberships, and bans are all removed with it. Heroes seated there return to My Heroes rather than being deleted.
      responses:
        "204":
          description: Campaign deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/regenerate-invite:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: regenerateInvite
      summary: Generate a fresh invite code (DM only)
      responses:
        "200":
          description: Campaign with the new invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/members:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listMembers
      summary: Everyone seated at the table (members only)
      responses:
        "200":
          description: The campaign's members, DMs first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: kickMember
      summary: |
        Remove a player from the table (DM only). Their heroes return to My Heroes, their claims on open quests are released, and they leave any knowledge pools. They may rejoin with the invite code unless banned.
      responses:
        "204":
          description: Removed from the campaign
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/bans:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listBans
      summary: Players barred from rejoining this campaign (DM only)
      responses:
        "200":
          description: Current bans, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ban"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: banMember
      summary: |
        Bar a user from this campaign (DM only). If currently a member they are kicked first; the invite code no longer admits them until unbanned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanRequest"
      responses:
        "204":
          description: Banned
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/bans/{userId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: unbanMember
      summary: Lift a ban so the invite code admits them again (DM only)
      responses:
        "204":
          description: Ban lifted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/leave:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: leaveCampaign
      summary: |
        Walk away from the table (members only). Your heroes return to My Heroes, your claims on open quests are released, and you leave any knowledge pools. The DM cannot leave — they disband the table instead.
      responses:
        "204":
          description: You have left the campaign
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/next-session:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setNextSession
      summary: Set or clear when the table gathers next (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNextSessionRequest"
      responses:
        "200":
          description: Campaign with the updated next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/quests:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listQuests
      summary: List quests on a campaign's board (members only)
      responses:
        "200":
          description: Quests with rewards and claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createQuest
      summary: Post a new quest (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestRequest"
      responses:
        "201":
          description: Created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quests/{questId}:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    patch:
      operationId: updateQuest
      summary: Update a quest, including its status and rewards (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestRequest"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuest
      summary: Remove a quest (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/seat-requests:
    get:
      operationId: listMySeatRequests
      summary: The caller's heroes still waiting at a table's door
      responses:
        "200":
          description: Pending requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MySeatRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/characters:
    get:
      operationId: listMyCharacters
      summary: The caller's heroes across all campaigns, including unseated ones
      responses:
        "200":
          description: Heroes with where they are seated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMyCharacter
      summary: Forge a hero in My Heroes (not seated at any campaign)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created hero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/characters/forge:
    post:
      operationId: forgeCharacter
      summary: Create a hero through the builder — full sheet, derived HP
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Same key, same hero. A forge that times out on a bad connection may in fact have landed, so the retry carries the key of the attempt it is repeating and gets that hero back (201) instead of forging a twin. Keys are scoped to the caller.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgeRequest"
      responses:
        "201":
          description: The forged hero, resting in My Heroes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /characters/{characterId}/seat:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: seatCharacter
      summary: |
        Seat a hero at a campaign, or null to return them to My Heroes. Seating is the owner's act alone; unseating is the owner's — or, for a seated hero, the table's DM benching them back to the owner's shelf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatRequest"
      responses:
        "200":
          description: Hero after moving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "202":
          description: The table's door is barred — the request is lodged and awaits the DM's nod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatPending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The hero uses content the campaign's codex has not admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatConflict"
  /characters/{characterId}/slots:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setSpellSlots
      summary: Set spell slots spent (owner or DM; casters only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpellSlotsInput"
      responses:
        "200":
          description: Hero with updated slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/items:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: addInventoryItem
      summary: Add an item to a hero's inventory (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: The new inventory row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateInventoryItem
      summary: Change quantity or equip state (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemPatch"
      responses:
        "200":
          description: The updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInventoryItem
      summary: Remove an inventory row (owner or DM)
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /rules/import:
    post:
      operationId: importContentPack
      summary: Batch-import a content pack as your private homebrew (upserts by name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entries
              properties:
                book:
                  type: string
                  maxLength: 80
                  description: |
                    Where this pack came from. Stamped onto every entry that
                    does not name its own data.book, so imported content reads
                    as its source everywhere instead of a flat "Homebrew".
                entries:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/PackEntry"
      responses:
        "200":
          description: Per-entry results (failures do not abort the batch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/export:
    get:
      operationId: exportContentPack
      summary: Your homebrew as a content pack (keep it out of public repos)
      responses:
        "200":
          description: The pack
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                properties:
                  book:
                    type: string
                    description: |
                      Always empty on export: a collection spans many books and
                      each entry already carries its own data.book. Its presence
                      tells an importer not to stamp a source of its own.
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew/impact:
    get:
      operationId: getHomebrewImpact
      summary: What a homebrew reset would touch — counts and in-use references
      responses:
        "200":
          description: Per-kind counts of your homebrew and what references it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomebrewImpact"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew/books:
    get:
      operationId: getHomebrewBooks
      summary: Your homebrew grouped by source book — the imported-packs shelf
      responses:
        "200":
          description: One row per (book, kind) pair; book is null for hand-scribed entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomebrewBooks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew:
    delete:
      operationId: resetHomebrew
      summary: Delete your homebrew — all of it, one kind, or one book (author's own only)
      parameters:
        - name: kind
          in: query
          required: false
          description: Limit the wipe to a single content kind (class, species, background, subclass, feat, spell, item, monster); omit to wipe every kind.
          schema:
            type: string
        - name: book
          in: query
          required: false
          description: Limit the wipe to entries whose data.book matches — removes one imported pack at a time. Mutually exclusive with kind.
          schema:
            type: string
      responses:
        "200":
          description: How many entries were removed
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/{kind}:
    parameters:
      - $ref: "#/components/parameters/ContentKind"
    get:
      operationId: listRules
      summary: Rules content of one kind (SRD + this instance's homebrew)
      responses:
        "200":
          description: Content entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulesContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRulesContent
      summary: Add a homebrew entry of this kind (any signed-in user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesContentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/content/{contentId}:
    parameters:
      - name: contentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateRulesContent
      summary: Edit a homebrew entry (author only; SRD is immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesContentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRulesContent
      summary: Remove a homebrew entry (author only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creatures:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: addCharacterCreature
      summary: Give a hero a form, companion or summon (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatureInput"
      responses:
        "201":
          description: The new creature, resolved for this hero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creatures/{creatureId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
      - name: creatureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCharacterCreature
      summary: Mold a creature's numbers, track its hit points, or take the form (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreaturePatch"
      responses:
        "200":
          description: The updated creature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCharacterCreature
      summary: Release a creature (owner or DM)
      responses:
        "204":
          description: Gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creature-options:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      operationId: getCreatureOptions
      summary: The forms and companions this hero's own features grant
      responses:
        "200":
          description: Everything the sheet entitles this hero to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatureOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/levelup:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: levelUpCharacter
      summary: Advance a forged hero one level (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelUpRequest"
      responses:
        "200":
          description: The hero, one level mightier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/rest:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: restCharacter
      summary: Take a long or short rest (owner or DM). A long rest restores HP to full, returns every spell slot and hands back half the hero's hit dice; a short rest spends hit dice to heal and returns a pact caster's slots. The report says what actually moved, including what each die rolled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestRequest"
      responses:
        "200":
          description: What the rest restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/spells/swap:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: swapCharacterSpells
      summary: Change prepared spells on a Long Rest (owner only). Allowed only for classes whose spellChanges rule says long-rest, and only as far as that rule permits — a Cleric re-prepares freely, a Paladin swaps one, a Bard cannot do it at all (its swap comes at level-up).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpellSwapRequest"
      responses:
        "200":
          description: The hero with its new list of spells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/events:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listEvents
      summary: The campaign chronicle, newest first (members)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: category
          in: query
          description: |
            Filter to one channel (all | dm | rules | player | log); omit or "all" for everything. Plain string, validated server-side.
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChronicleEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addChronicleNote
      summary: Write an entry into the chronicle (any member; players post to player chat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
                category:
                  type: string
                  description: |
                    The DM's channel choice — "dm" (story note) or "rules" (a ruling); defaults to dm. Ignored for players, who always post to player chat. Plain string, validated server-side.
      responses:
        "201":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChronicleEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/xp:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: grantXP
      summary: Grant (or dock) XP to seated heroes (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: -100000
                  maximum: 100000
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Omit to grant to every seated hero.
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: The heroes after the grant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/milestone:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: declareMilestone
      summary: A milestone — seated heroes gain one pending level-up (DM only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 200
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Grant only to these seated heroes; omitted means the whole party.
      responses:
        "204":
          description: Declared
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/milestone/revoke:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: revokeMilestone
      summary: |
        Take back an unspent level-up (DM only) — from the chosen heroes, or one from everyone when none are named. Already-spent levels stay.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Taken back
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/progression:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setProgression
      summary: Switch the campaign between milestone and XP progression (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - milestone
                    - xp
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/max-level:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setMaxLevel
      summary: Set or clear the table's level ceiling (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxLevel:
                  type: integer
                  minimum: 1
                  maximum: 20
                  nullable: true
                  description: Highest level heroes may reach here; null restores the standard 20.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/max-seated:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setMaxSeatedPerPlayer
      summary: Set how many heroes one player may seat at this table at once (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxSeatedPerPlayer
              properties:
                maxSeatedPerPlayer:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: |
                    Seats per player. Lowering it never unseats anyone — it only bars further seating until the player is back under the cap.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/seating-approval:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setSeatingApproval
      summary: Bar or open the table's door — barred means new heroes wait for the DM's nod (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/hidden-sheets:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setHiddenSheets
      summary: Draw or lift the veil over the table's character sheets (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: |
                    True veils every hero from the other players — names only. False returns the party to open sheets.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /characters/{characterId}/reveal:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: revealCharacter
      summary: Lift or drop the veil on one seated hero's sheet (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revealed
              properties:
                revealed:
                  type: boolean
                  description: True opens this hero's sheet to the party; false veils them again.
      responses:
        "200":
          description: The hero, as the party now sees them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/seat-requests:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listSeatRequests
      summary: The heroes waiting at the door, oldest first (DM only)
      responses:
        "200":
          description: Pending seat requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSeat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/seat-requests/{characterId}/approve:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: approveSeatRequest
      summary: |
        Let a waiting hero take their seat (DM only); re-checks the codex and the table's seats-per-player cap first
      responses:
        "204":
          description: Seated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The hero uses content the campaign's codex has not admitted; the request stays pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatConflict"
  /campaigns/{campaignId}/seat-requests/{characterId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/CharacterId"
    delete:
      operationId: denySeatRequest
      summary: Turn a waiting hero away from the door (DM only)
      responses:
        "204":
          description: Turned away
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/codex:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getCodex
      summary: The campaign's codex — every explicit ruling plus proposals (members)
      responses:
        "200":
          description: Codex entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodexEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: proposeCodexContent
      summary: Offer your homebrew to the table (members; DM decides)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentIds
              properties:
                contentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Proposed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/codex/bulk:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: setCodexStatusBulk
      summary: One verdict over many entries (DM only — pack admissions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentIds
                - status
              properties:
                contentIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
                status:
                  type: string
                  enum:
                    - enabled
                    - banned
      responses:
        "204":
          description: Ruled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/codex/{contentId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - name: contentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setCodexStatus
      summary: The DM's verdict on an entry (enable homebrew, ban/unban SRD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - enabled
                    - banned
      responses:
        "204":
          description: Ruled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: clearCodexStatus
      summary: Remove a ruling — back to defaults (DM only)
      responses:
        "204":
          description: Cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/characters:

# GENERATED by npm run gen:bundle — edit openapi/ instead, then `make generate`.
openapi: 3.0.3
info:
  title: Quest Board API
  version: 0.1.0
  description: |
    Self-hosted D&D campaign helper. This spec is the single source of truth for
    the API contract: the Go server interface and the TypeScript client are both
    generated from it (`make generate`).
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness / readiness probe
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getCurrentUser
      summary: The currently authenticated user and their campaign memberships
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/friends:
    get:
      operationId: listFriends
      summary: Your friends, the requests either way, and who you have blocked
      responses:
        "200":
          description: The roll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: askFriend
      summary: Ask somebody to be your friend, by their code
      description: Answers 404 for a code nobody holds, and the same 404 for a code held by somebody who has blocked you — a block that could be detected by probing would not be much of a block. Asking somebody who has already asked you accepts instead, because two people asking each other means yes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskFriendRequest"
      responses:
        "200":
          description: The roll, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/friends/code:
    post:
      operationId: reforgeFriendCode
      summary: Draw a fresh friend code, retiring the old one
      responses:
        "200":
          description: The roll, carrying the new code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/friends/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: acceptFriend
      summary: Accept a request somebody made of you
      responses:
        "200":
          description: The roll, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: dropFriend
      summary: Withdraw a request, decline one, or part ways
      description: "One door for all three, because they are one act: the row between you goes. What was said is not deleted with it — a conversation you both had is not the friendship's to erase."
      responses:
        "200":
          description: The roll, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: blockUser
      summary: Block somebody — parts you if you were friends, and stops both directions
      responses:
        "200":
          description: The roll, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: unblockUser
      summary: Lift a block. It does not restore the friendship.
      responses:
        "200":
          description: The roll, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRoll"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/messages:
    get:
      operationId: listThreads
      summary: The inbox — everyone you have spoken with, newest first
      responses:
        "200":
          description: One row per conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/messages/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: readThread
      summary: One conversation, oldest first, and marks it read
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendDirectMessage
      summary: Say something to one person
      description: Open to a friend, or to anybody you already share a table with — the social graph of this app is mostly the campaigns you sit at, and needing to befriend the player beside you first would be ceremony. A block closes it in both directions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: What was said
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /parties/{partyId}/messages:
    parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listPartyMessages
      summary: A party's own room, for a table that has split
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendPartyMessage
      summary: Say something to your party
      description: Open to the DM and to whoever rides with that party right now. A player whose heroes ride elsewhere is answered 404 rather than 403, exactly as the rest of the app answers a room you are not in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: What was said
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns:
    get:
      operationId: listCampaigns
      summary: Campaigns the current user belongs to
      responses:
        "200":
          description: List of campaigns with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCampaign
      summary: Create a campaign (caller becomes its DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /campaigns/join:
    post:
      operationId: joinCampaign
      summary: Join a campaign as a player using its invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCampaignRequest"
      responses:
        "200":
          description: The joined campaign with the caller's role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    delete:
      operationId: deleteCampaign
      summary: Permanently delete a campaign (DM only)
      description: |
        Strikes the campaign for good: quests, the chronicle, codex rulings, maps, encounters, memberships, and bans are all removed with it. Heroes seated there return to My Heroes rather than being deleted.
      responses:
        "204":
          description: Campaign deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/regenerate-invite:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: regenerateInvite
      summary: Generate a fresh invite code (DM only)
      responses:
        "200":
          description: Campaign with the new invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/members:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listMembers
      summary: Everyone seated at the table (members only)
      responses:
        "200":
          description: The campaign's members, DMs first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: kickMember
      summary: |
        Remove a player from the table (DM only). Their heroes return to My Heroes, their claims on open quests are released, and they leave any knowledge pools. They may rejoin with the invite code unless banned.
      responses:
        "204":
          description: Removed from the campaign
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/bans:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listBans
      summary: Players barred from rejoining this campaign (DM only)
      responses:
        "200":
          description: Current bans, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ban"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: banMember
      summary: |
        Bar a user from this campaign (DM only). If currently a member they are kicked first; the invite code no longer admits them until unbanned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanRequest"
      responses:
        "204":
          description: Banned
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/bans/{userId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: unbanMember
      summary: Lift a ban so the invite code admits them again (DM only)
      responses:
        "204":
          description: Ban lifted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/leave:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: leaveCampaign
      summary: |
        Walk away from the table (members only). Your heroes return to My Heroes, your claims on open quests are released, and you leave any knowledge pools. The DM cannot leave — they disband the table instead.
      responses:
        "204":
          description: You have left the campaign
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/next-session:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setNextSession
      summary: Set or clear when the table gathers next (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNextSessionRequest"
      responses:
        "200":
          description: Campaign with the updated next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/quests:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listQuests
      summary: List quests on a campaign's board (members only)
      responses:
        "200":
          description: Quests with rewards and claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createQuest
      summary: Post a new quest (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestRequest"
      responses:
        "201":
          description: Created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quests/{questId}:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    patch:
      operationId: updateQuest
      summary: Update a quest, including its status and rewards (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestRequest"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuest
      summary: Remove a quest (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/seat-requests:
    get:
      operationId: listMySeatRequests
      summary: The caller's heroes still waiting at a table's door
      responses:
        "200":
          description: Pending requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MySeatRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/characters:
    get:
      operationId: listMyCharacters
      summary: The caller's heroes across all campaigns, including unseated ones
      responses:
        "200":
          description: Heroes with where they are seated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMyCharacter
      summary: Forge a hero in My Heroes (not seated at any campaign)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created hero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/characters/forge:
    post:
      operationId: forgeCharacter
      summary: Create a hero through the builder — full sheet, derived HP
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Same key, same hero. A forge that times out on a bad connection may in fact have landed, so the retry carries the key of the attempt it is repeating and gets that hero back (201) instead of forging a twin. Keys are scoped to the caller.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgeRequest"
      responses:
        "201":
          description: The forged hero, resting in My Heroes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /characters/{characterId}/seat:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: seatCharacter
      summary: |
        Seat a hero at a campaign, or null to return them to My Heroes. Seating is the owner's act alone; unseating is the owner's — or, for a seated hero, the table's DM benching them back to the owner's shelf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatRequest"
      responses:
        "200":
          description: Hero after moving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "202":
          description: The table's door is barred — the request is lodged and awaits the DM's nod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatPending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The hero uses content the campaign's codex has not admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatConflict"
  /characters/{characterId}/slots:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setSpellSlots
      summary: Set spell slots spent (owner or DM; casters only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpellSlotsInput"
      responses:
        "200":
          description: Hero with updated slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/pools:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setPools
      summary: Set resource-pool uses spent (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolsInput"
      responses:
        "200":
          description: Hero with updated pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/items:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: addInventoryItem
      summary: Add an item to a hero's inventory (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: The new inventory row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateInventoryItem
      summary: Change quantity or equip state (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemPatch"
      responses:
        "200":
          description: The updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInventoryItem
      summary: Remove an inventory row (owner or DM)
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /rules/import:
    post:
      operationId: importContentPack
      summary: Batch-import a content pack as your private homebrew (upserts by name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entries
              properties:
                book:
                  type: string
                  maxLength: 80
                  description: |
                    Where this pack came from. Stamped onto every entry that
                    does not name its own data.book, so imported content reads
                    as its source everywhere instead of a flat "Homebrew".
                entries:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/PackEntry"
      responses:
        "200":
          description: Per-entry results (failures do not abort the batch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/export:
    get:
      operationId: exportContentPack
      summary: Your homebrew as a content pack (keep it out of public repos)
      responses:
        "200":
          description: The pack
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                properties:
                  book:
                    type: string
                    description: |
                      Always empty on export: a collection spans many books and
                      each entry already carries its own data.book. Its presence
                      tells an importer not to stamp a source of its own.
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew/impact:
    get:
      operationId: getHomebrewImpact
      summary: What a homebrew reset would touch — counts and in-use references
      responses:
        "200":
          description: Per-kind counts of your homebrew and what references it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomebrewImpact"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew/books:
    get:
      operationId: getHomebrewBooks
      summary: Your homebrew grouped by source book — the imported-packs shelf
      responses:
        "200":
          description: One row per (book, kind) pair; book is null for hand-scribed entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomebrewBooks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/homebrew:
    delete:
      operationId: resetHomebrew
      summary: Delete your homebrew — all of it, one kind, or one book (author's own only)
      parameters:
        - name: kind
          in: query
          required: false
          description: Limit the wipe to a single content kind (class, species, background, subclass, feat, spell, item, monster); omit to wipe every kind.
          schema:
            type: string
        - name: book
          in: query
          required: false
          description: Limit the wipe to entries whose data.book matches — removes one imported pack at a time. Mutually exclusive with kind.
          schema:
            type: string
      responses:
        "200":
          description: How many entries were removed
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/{kind}:
    parameters:
      - $ref: "#/components/parameters/ContentKind"
    get:
      operationId: listRules
      summary: Rules content of one kind (SRD + this instance's homebrew)
      responses:
        "200":
          description: Content entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulesContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRulesContent
      summary: Add a homebrew entry of this kind (any signed-in user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesContentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules/content/{contentId}:
    parameters:
      - name: contentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateRulesContent
      summary: Edit a homebrew entry (author only; SRD is immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesContentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRulesContent
      summary: Remove a homebrew entry (author only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creatures:
    parameters:
      - $ref: "#/components/parameters/CharacterId"

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/encounters:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listEncounters
      summary: The DM's encounter library — every prepared fight, running or not (DM only)
      responses:
        "200":
          description: Encounters, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Encounter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createEncounter
      summary: Prepare a new (inactive) encounter (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncounterRequest"
      responses:
        "201":
          description: The new encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/encounters/active:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getActiveEncounter
      summary: The running encounter this member is in — the fight their hero stands in for a player, the most recently triggered one for the DM. Redacted for players. 204 when none applies.
      responses:
        "200":
          description: The active encounter and its combatants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "204":
          description: No encounter is running for this member
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/encounters/stand-down:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: standDownEncounters
      summary: Stand down every running encounter at once, releasing every summoned hero (DM only). The way out when several fights are open and a player is stuck in one of them.
      responses:
        "200":
          description: The encounters that were stood down
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Encounter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /encounters/{encounterId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    get:
      operationId: getEncounter
      summary: One encounter with its combatants — full detail (DM only)
      responses:
        "200":
          description: The encounter and its combatants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEncounter
      summary: Rename, trigger/end, or advance the tracker (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEncounterRequest"
      responses:
        "200":
          description: The updated encounter and combatants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEncounter
      summary: Discard an encounter and its combatants (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/filing:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    put:
      operationId: fileEncounter
      summary: File an encounter under a session tag and/or a place (DM only)
      description: Replaces the encounter's filing wholesale, so one call can move it, unpin it, or clear its tag. The library groups on these two fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileEncounterRequest"
      responses:
        "200":
          description: The refiled encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/combatants:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    post:
      operationId: addCombatant
      summary: Add a Den monster, a seated PC, or a custom line (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCombatantRequest"
      responses:
        "201":
          description: The combatants added — one element for a lone addition, or every member of the group when count > 1.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Combatant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/roll-initiative:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    post:
      operationId: rollInitiative
      summary: Roll initiative (d20 + modifier) for every combatant at once (DM only)
      responses:
        "200":
          description: The encounter with rolled initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /combatants/{combatantId}:
    parameters:
      - $ref: "#/components/parameters/CombatantId"
    patch:
      operationId: updateCombatant
      summary: Edit a combatant — HP, initiative, reveal, rename (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCombatantRequest"
      responses:
        "200":
          description: The updated combatant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combatant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCombatant
      summary: Remove a combatant (DM only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /encounters/{encounterId}/combatant-groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCombatantGroup
      summary: Remove a whole mob at once (DM only)
      description: Deletes every combatant sharing this groupId. Removing one dead skeleton is still a plain combatant delete; this is for clearing the entire unit.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /combatants/{combatantId}/roll:
    parameters:
      - $ref: "#/components/parameters/CombatantId"
    post:
      operationId: rollCombatantInitiative
      summary: Roll this combatant's initiative (DM, or the owner of a PC combatant)
      responses:
        "200":
          description: The combatant with a fresh initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combatant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  security:
    - sessionCookie: []
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TreeId:
      name: treeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - class
          - species
          - background
          - subclass
          - feat
          - spell
          - item
          - monster
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PinId:
      name: pinId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CombatantId:
      name: combatantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed (not a member, or insufficient role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Role:
      type: string
      enum:
        - dm
        - player
    User:
      type: object
      required:
        - id
        - name
        - provider
        - emailVerified
        - twofaEnabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        provider:
          type: string
          description: Where the account came from — discord, google, local, or dev.
        emailVerified:
          type: boolean
          description: Whether the account's email address is confirmed (OAuth accounts always are).
        twofaEnabled:
          type: boolean
          description: Whether the account has TOTP two-factor authentication turned on (local accounts only).
        createdAt:
          type: string
          format: date-time
    Campaign:
      type: object
      required:
        - id
        - name
        - ownerUserId
        - createdAt
        - inviteCode
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        inviteCode:
          type: string
          description: Shareable code players use to join the campaign.
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: When the table gathers next; null when unscheduled.
        progression:
          type: string
          enum:
            - milestone
            - xp
          description: How heroes advance at this table.
        maxLevel:
          type: integer
          nullable: true
          description: The DM's level ceiling for this table; null means the standard 20.
        requireSeatingApproval:
          type: boolean
          description: When true the door is barred — new heroes wait for the DM's approval before seating.
        maxSeatedPerPlayer:
          type: integer
          description: |
            How many heroes one player may seat at this table at once. The DM's dial; defaults to one. The cap holds the door — heroes already seated are never evicted by lowering it.
        hiddenSheets:
          type: boolean
          description: |
            When true the veil is drawn over the table's character sheets: a player sees only the names of the other heroes. Owners and the DM always read their own sheets in full, and the DM may lift the veil on individual heroes.
    CampaignMembership:
      type: object
      required:
        - campaign
        - role
      properties:
        campaign:
          $ref: "#/components/schemas/Campaign"
        role:
          $ref: "#/components/schemas/Role"
    Member:
      type: object
      required:
        - userId
        - name
        - role
        - joinedAt
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    Ban:
      type: object
      required:
        - userId
        - name
        - bannedAt
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
          nullable: true
        bannedAt:
          type: string
          format: date-time
    BanRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    PendingSeat:
      type: object
      required:
        - characterId
        - name
        - level
        - ownerName
        - requestedAt
      properties:
        characterId:
          type: string
          format: uuid
        name:
          type: string
        class:
          type: string
          nullable: true
        level:
          type: integer
        ownerName:
          type: string
          description: Display name of the player who knocks.
        requestedAt:
          type: string
          format: date-time
    SeatPending:
      type: object
      required:
        - campaignId
        - campaignName
      properties:
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
    MySeatRequest:
      type: object
      required:
        - characterId
        - campaignId
        - campaignName
      properties:
        characterId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
    CurrentUser:
      type: object
      required:
        - user
        - campaigns
      properties:
        user:
          $ref: "#/components/schemas/User"
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/CampaignMembership"
    CreateCampaignRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    JoinCampaignRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
    SetNextSessionRequest:
      type: object
      properties:
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: Omit or send null to clear the scheduled session.
    QuestStatus:
      type: string
      enum:
        - available
        - active
        - completed
        - failed
    QuestDifficulty:
      type: string
      enum:
        - trivial
        - easy
        - medium
        - hard
        - deadly
    RewardType:
      type: string
      enum:
        - gold
        - item
        - xp
        - reputation
        - other
    QuestReward:
      type: object
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/RewardType"
        label:
          type: string
        value:
          type: string
          nullable: true
    QuestClaim:
      type: object
      required:
        - userId
        - userName
        - claimedAt
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        claimedAt:
          type: string
          format: date-time
    Quest:
      type: object
      required:
        - id
        - campaignId
        - title
        - description
        - difficulty
        - status
        - createdAt
        - rewards
        - claims
        - claimedByMe
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        giver:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          description: Display name of the place this notice hangs in.
        locationId:
          type: string
          format: uuid
          nullable: true
        visibleToParty:
          type: boolean
          description: DM-only. The party-wide veil on this notice.
        hiddenByLocation:
          type: boolean
          description: DM-only. True when the place this notice hangs in (or one above it) is still veiled, so the notice stays off the players' board however it is set.
        visibility:
          type: array
          description: DM-only. Per-hero exceptions to visibleToParty.
          items:
            $ref: "#/components/schemas/VisibilityOverride"
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        status:
          $ref: "#/components/schemas/QuestStatus"
        createdAt:
          type: string
          format: date-time
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/QuestReward"
        claims:
          type: array
          items:
            $ref: "#/components/schemas/QuestClaim"
        claimedByMe:
          type: boolean
    Character:
      type: object
      required:
        - id
        - ownerUserId
        - ownerName
        - name
        - class
        - level
        - hpCurrent
        - hpMax
        - createdAt
        - mine
        - tableBorn
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: The campaign this hero is seated at; null while in My Heroes.
        campaignName:
          type: string
          nullable: true
          description: Name of the seated campaign, when known.
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
          description: Display name of the member who plays this character.
        name:
          type: string
        class:
          type: string
          description: Freeform class/ancestry line, e.g. "Half-Elf Bard".
        hitDiceUsed:
          type: integer
          description: Hit dice already spent. The total is the hero's level, so what is left to spend on a short rest is level minus this.
        level:
          type: integer
        hpCurrent:
          type: integer
        hpMax:
          type: integer
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: True when the caller owns this character.
        tableBorn:
          type: boolean
          description: |
            Born of a quick-add on a campaign roster: lives and dies with the table, never listed in My Heroes, never seated elsewhere. Account heroes are the opposite — the roster may only unseat them.
        xp:
          type: integer
          description: Experience points (XP-mode campaigns; advisory).
        pendingLevels:
          type: integer
          description: Milestone level-ups waiting to be taken.
        concealed:
          type: boolean
          description: |
            True when the table's veil hides this hero from the caller. Only the name (and who plays them) is real — class, level, HP and the sheet come back emptied, and the full sheet is refused.
        revealed:
          type: boolean
          description: |
            True when the DM has lifted the veil on this hero, so the party reads their sheet even while the table's sheets are veiled. Only meaningful on a veiled table.
        sheet:
          $ref: "#/components/schemas/CharacterSheet"
    CharacterSheet:
      type: object
      description: Present only on wizard-forged heroes.
      required:
        - abilities
        - skills
      properties:
        abilities:
          $ref: "#/components/schemas/AbilityScores"
        skills:
          type: array
          items:
            type: string
        classId:
          type: string
          format: uuid
          nullable: true
        speciesId:
          type: string
          format: uuid
          nullable: true
        backgroundId:
          type: string
          format: uuid
          nullable: true
        subclassId:
          type: string
          format: uuid
          nullable: true
        feats:
          type: array
          items:
            type: string
        speciesChoices:
          $ref: "#/components/schemas/SpeciesChoices"
          description: The species picks made at creation, keyed by choice id.
        spellcastingAbility:
          type: string
          description: Present on casters (STR…CHA).
        spellSlots:
          type: array
          description: Present on casters — max and used per spell level.
          items:
            $ref: "#/components/schemas/SpellSlot"
    SpeciesChoices:
      type: object
      description: Species picks keyed by the choice id declared in the species entry's data, each holding the chosen option names.
      additionalProperties:
        type: array
        items:
          type: string
    SpellSlot:
      type: object
      required:
        - level
        - max
        - used
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 9
        max:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
    AbilityScores:
      type: object
      required:
        - str
        - dex
        - con
        - int
        - wis
        - cha
      properties:
        str:
          type: integer
          minimum: 3
          maximum: 30
        dex:
          type: integer
          minimum: 3
          maximum: 30
        con:
          type: integer
          minimum: 3
          maximum: 30
        int:
          type: integer
          minimum: 3
          maximum: 30
        wis:
          type: integer
          minimum: 3
          maximum: 30
        cha:
          type: integer
          minimum: 3
          maximum: 30
    ForgeRequest:
      type: object
      required:
        - name
        - classId
        - speciesId
        - backgroundId
        - abilities
        - skills
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        classId:
          type: string
          format: uuid
        speciesId:
          type: string
          format: uuid
        backgroundId:
          type: string
          format: uuid
        abilities:
          $ref: "#/components/schemas/AbilityScores"
          description: Final scores, background bonuses already applied.
        skills:
          type: array
          items:
            type: string
          description: Chosen class skills (background skills are implied).
        spells:
          type: array
          items:
            type: string
            format: uuid
          description: Level-1 spell picks (casters only; cantrips included).
        gear:
          type: string
          maxLength: 1
          description: "Starting-equipment option label (A/B/C) from the class's startingEquipment data. The server stocks the inventory: listed items (linked to armory content where names match), gold as a Gold Pieces row, plus the background's equipment items."
        speciesChoices:
          $ref: "#/components/schemas/SpeciesChoices"
          description: One entry per choice the species offers, keyed by choice id — an Elf's lineage, a Gnome's Forest-or-Rock, a Human's free skill and Origin feat. Every offered choice must be answered.
    CharacterInput:
      type: object
      required:
        - name
        - level
        - hpCurrent
        - hpMax
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        class:
          type: string
          maxLength: 80
        level:
          type: integer
          minimum: 1
          maximum: 20
        hpCurrent:
          type: integer
          minimum: 0
        hpMax:
          type: integer
          minimum: 1
    SeatRequest:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: Omit or null to unseat the hero back to My Heroes.
    RulesContent:
      type: object
      required:
        - id
        - kind
        - source
        - name
        - summary
        - data
        - mine
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - class
            - species
            - background
            - subclass
            - feat
            - spell
            - item
            - monster
        source:
          type: string
          enum:
            - srd
            - homebrew
        name:
          type: string
        summary:
          type: string
        data:
          type: object
          description: Kind-specific payload (hit die, traits, features…).
          additionalProperties: true
        mine:
          type: boolean
          description: True when the caller authored this homebrew entry.
        creatorName:
          type: string
          nullable: true
          description: Author of a homebrew entry; null for SRD content.
    RulesContentInput:
      type: object
      required:
        - name
        - summary
        - data
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 300
        data:
          type: object
          additionalProperties: true
    RestRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - long
            - short
        hitDice:
          type: integer
          description: "Short rest only: how many hit dice to spend healing. Ignored on a long rest, which spends none."
    RestReport:
      type: object
      required:
        - character
        - kind
        - hpRestored
        - hitDiceSpent
        - hitDiceRegained
        - hitDiceLeft
        - slotsRestored
        - rolls
        - canSwapSpells
      properties:
        character:
          $ref: "#/components/schemas/Character"
        kind:
          type: string
        hpRestored:
          type: integer
          description: Hit points actually regained — 0 when the hero was already whole.
        hitDiceSpent:
          type: integer
        hitDiceRegained:
          type: integer
        hitDiceLeft:
          type: integer
          description: Hit dice still available to spend after this rest.
        slotsRestored:
          type: boolean
          description: Whether spell slots came back. Always on a long rest; on a short rest only for a pact caster, whose slots are the ones that return.
        rolls:
          type: array
          description: What each spent hit die rolled, before the CON modifier.
          items:
            type: integer
        canSwapSpells:
          type: boolean
          description: Whether this hero's class may change its prepared spells now — the long-rest trigger the spell swap has been waiting for.
    SpellSwap:
      type: object
      description: One spell traded for another; both must be the same kind (cantrip for cantrip).
      required:
        - replace
        - with
      properties:
        replace:
          type: string
          format: uuid
          description: A spell the hero currently knows.
        with:
          type: string
          format: uuid
          description: Its replacement, legal for the class and the hero's level.
    SpellSwapRequest:
      type: object
      required:
        - swaps
      properties:
        swaps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SpellSwap"
    LevelUpRequest:
      type: object
      required:
        - hpMode
      properties:
        hpMode:
          type: string
          enum:
            - average
            - roll
        hpRoll:
          type: integer
          minimum: 1
          maximum: 12
          description: The hit-die result when hpMode is roll.
        subclassId:
          type: string
          format: uuid
          description: Required when the new level is the class's subclass level.
        featId:
          type: string
          format: uuid
          description: Take a feat instead of ability increases at an ASI level.
        spells:
          type: array
          items:
            type: string
            format: uuid
          description: New spell picks gained with this level (casters only).
        spellSwaps:
          type: array
          items:
            $ref: "#/components/schemas/SpellSwap"
          description: Spells traded on gaining this level, for classes whose spellChanges rule says level-up (Bard, Sorcerer, Warlock).
        asi:
          type: object
          description: Ability increases at an ASI level; total of 2 points, each +1 or +2.
          additionalProperties: false
          properties:
            str:
              type: integer
              minimum: 1
              maximum: 2
            dex:
              type: integer
              minimum: 1
              maximum: 2
            con:
              type: integer
              minimum: 1
              maximum: 2
            int:
              type: integer
              minimum: 1
              maximum: 2
            wis:
              type: integer
              minimum: 1
              maximum: 2
            cha:
              type: integer
              minimum: 1
              maximum: 2
    CodexEntry:
      type: object
      required:
        - content
        - status
      properties:
        content:
          $ref: "#/components/schemas/RulesContent"
        status:
          type: string
          enum:
            - proposed
            - enabled
            - banned
        proposerName:
          type: string
          nullable: true
    SeatConflict:
      type: object
      required:
        - error
        - missing
      properties:
        error:
          type: string
        missing:
          type: array
          description: Content the hero uses that the codex has not admitted.
          items:
            type: object
            required:
              - id
              - kind
              - name
              - state
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
              name:
                type: string
              state:
                type: string
                enum:
                  - absent
                  - proposed
                  - banned
                description: absent = never offered; proposed = awaiting the DM; banned = the DM said no.
    SpellSlotsInput:
      type: object
      required:
        - used
      properties:
        used:
          type: array
          maxItems: 9
          items:
            type: integer
            minimum: 0
          description: Slots spent per spell level (index 0 = level 1).
    InventoryItem:
      type: object
      required:
        - id
        - name
        - qty
        - equipped
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        qty:
          type: integer
        equipped:
          type: boolean
        slot:
          type: string
          enum:
            - ""
            - armor
            - mainhand
            - offhand
          description: Where an equipped item sits; empty when stowed.
        content:
          $ref: "#/components/schemas/RulesContent"
          nullable: true
          description: The rules entry behind this row; null for free-text gear.
    InventoryItemInput:
      type: object
      properties:
        contentId:
          type: string
          format: uuid
          description: An item from the library — or omit and use name for free-text gear.
        name:
          type: string
          maxLength: 80
        qty:
          type: integer
          minimum: 1
          maximum: 999
          default: 1
    InventoryItemPatch:
      type: object
      properties:
        qty:
          type: integer
          minimum: 1
          maximum: 999
        equipped:
          type: boolean
        slot:
          type: string
          enum:
            - armor
            - mainhand
            - offhand
          description: Equip into a specific slot (implies equipped). Armor only fits the armor slot, shields only the off-hand; weapons fit either hand. Displaced occupants are unequipped in the same stroke. Use equipped:false to stow.
    CharacterDetail:
      type: object
      required:
        - character
        - spells
        - items
        - creatures
      properties:
        character:
          $ref: "#/components/schemas/Character"
        spells:
          type: array
          items:
            $ref: "#/components/schemas/RulesContent"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        creatures:
          type: array
          description: The hero's second stat blocks — forms they take and companions that fight beside them — already resolved, so the sheet needs no second round trip and players need no reach into the Den.
          items:
            $ref: "#/components/schemas/CharacterCreature"
    CreatureRole:
      type: string
      enum:
        - form
        - companion
        - summon
      description: What the second stat block is to the hero. A `form` replaces their statistics while keeping their hit points (Wild Shape); a `companion` is a separate creature with its own pool that stays between sessions (a Steel Defender, a familiar, a steed); a `summon` is the same but temporary.
    CharacterCreature:
      type: object
      required:
        - id
        - role
        - name
        - active
        - block
        - molded
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CreatureRole"
        name:
          type: string
          description: The player's name for it — a wolf companion is somebody's Grey.
        grantedBy:
          type: string
          description: The feature that granted it, for the stamp on the sheet.
        active:
          type: boolean
          description: Currently shaped into, or currently on the field.
        hpCurrent:
          type: integer
          nullable: true
          description: Damage tracked against `hpMax`. Null on a form, which has no pool of its own — in a form the hero keeps their own hit points and gains temporary ones instead.
        hpMax:
          type: integer
          nullable: true
          description: "Read-only, and read off the resolved block rather than stored: a companion whose pool is \"five times your level\" has to grow when the hero does. Houserule it by overriding `hp` like any other field."
        notes:
          type: string
        contentId:
          type: string
          format: uuid
          nullable: true
          description: The library stat block behind it; null for one written by hand.
        blockSource:
          type: string
          enum:
            - srd
            - homebrew
            - custom
          description: Where the numbers came from. `custom` means there is no library entry.
        block:
          type: object
          additionalProperties: true
          description: "The stat block as played: the library entry, with any `scale` expressions on it evaluated against this hero, with the player's overrides applied on top."
        molded:
          type: array
          items:
            type: string
          description: Which fields the player has set by hand. Everything else still tracks the library entry and re-scales when the hero levels.
        overrides:
          type: object
          additionalProperties: true
          description: "The molded values themselves, unmerged. An editor needs these: `block` cannot tell a hand-set number from the book's, so building a patch from it would silently un-mold every field the player did not retype."
        tempHp:
          type: integer
          nullable: true
          description: Temporary hit points assuming this form grants, when the granting feature declares them. Forms only.
    CreatureInput:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/CreatureRole"
        contentId:
          type: string
          format: uuid
          description: A stat block from the library. Omit and supply a name to write one by hand instead. A player may only draw on blocks their own features grant; a DM may draw on any the campaign admits.
        name:
          type: string
          maxLength: 80
          description: Defaults to the library entry's name.
        grantedBy:
          type: string
          maxLength: 80
        overrides:
          type: object
          additionalProperties: true
          description: Fields to mold from the outset.
        notes:
          type: string
          maxLength: 2000
    CreaturePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        overrides:
          type: object
          additionalProperties: true
          description: Replaces the whole override map, so removing a field un-molds it and hands that number back to the library entry.
        hpCurrent:
          type: integer
          minimum: 0
          description: Where the creature stands now, clamped to the block's hit points. The maximum is not settable here — override `hp` to change it.
        active:
          type: boolean
          description: Assuming a form drops any other form the hero is holding — one shape at a time. Companions and summons are independent of each other.
        notes:
          type: string
          maxLength: 2000
    CreatureOption:
      type: object
      required:
        - name
        - role
        - block
      properties:
        contentId:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        role:
          $ref: "#/components/schemas/CreatureRole"
        grantedBy:
          type: string
          description: The feature offering it.
        block:
          type: object
          additionalProperties: true
          description: Resolved for this hero, so the picker previews real numbers.
    FormAllowance:
      type: object
      required:
        - feature
        - known
        - maxCR
        - fly
        - tempHp
        - options
      properties:
        feature:
          type: string
          description: The feature granting the forms, e.g. "Wild Shape".
        creatureType:
          type: string
          description: The creature type forms are drawn from, e.g. "Beast".
        known:
          type: integer
          description: How many forms the hero may know at their level.
        maxCR:
          type: number
          description: The Challenge Rating ceiling at their level.
        fly:
          type: boolean
          description: Whether a form with a Fly Speed is allowed yet.
        tempHp:
          type: integer
          description: Temporary hit points assuming a form grants.
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreatureOption"
    CreatureOptions:
      type: object
      required:
        - forms
        - companions
      description: What this hero's features actually grant. This is the only way a player reaches monster stat blocks — the Den stays a DM room, and this is narrowed to the creatures their own sheet entitles them to.
      properties:
        forms:
          type: array
          items:
            $ref: "#/components/schemas/FormAllowance"
        companions:
          type: array
          items:
            $ref: "#/components/schemas/CreatureOption"
    Vendor:
      type: object
      required:
        - id
        - name
        - description
        - revealed
        - stock
        - isDM
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        locationId:
          type: string
          format: uuid
          nullable: true
        locationName:
          type: string
          nullable: true
          description: The place this shop trades in — null when it is filed nowhere.
        revealed:
          type: boolean
          description: Whether the party has met this shop. Players are only ever sent revealed shops, so for them this is always true; the DM sees it as a switch.
        stock:
          type: array
          items:
            $ref: "#/components/schemas/VendorStock"
        isDM:
          type: boolean
          description: Whether the viewer may edit this shop and reveal its shelves.
    VendorStock:
      type: object
      required:
        - id
        - name
        - price
        - revealed
      properties:
        id:
          type: string
          format: uuid
        contentId:
          type: string
          format: uuid
          nullable: true
          description: The armory entry behind this line; null for a written-in line.
        name:
          type: string
        price:
          type: string
          description: What this trader asks — a shop marks up, so it is not the item's own cost.
        qty:
          type: integer
          nullable: true
          description: How many are in stock; null is "as many as you like".
        revealed:
          type: boolean
        item:
          $ref: "#/components/schemas/RulesContent"
          nullable: true
          description: The armory entry, so a player can read what they are being offered.
    VendorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        locationId:
          type: string
          format: uuid
          nullable: true
        revealed:
          type: boolean
    StockInput:
      type: object
      properties:
        contentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: Required for a written-in line; taken from the armory entry otherwise.
        price:
          type: string
        qty:
          type: integer
          nullable: true
    StockPatch:
      type: object
      properties:
        price:
          type: string
        qty:
          type: integer
          nullable: true
        revealed:
          type: boolean
    BestiaryNote:
      type: object
      required:
        - id
        - body
        - mine
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        authorName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: Whether the viewer penned this note.
    CampaignMap:
      type: object
      required:
        - id
        - campaignId
        - name
        - fogEnabled
        - width
        - height
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        parentMapId:
          type: string
          format: uuid
          nullable: true
          description: The map this one details; null for an overworld.
        name:
          type: string
        fogEnabled:
          type: boolean
          description: When true, players see only what their reveal circles uncover.
        width:
          type: integer
          description: Pixel width of the stored image.
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
    MapPin:
      type: object
      required:
        - id
        - mapId
        - label
        - note
        - x
        - "y"
        - dmOnly
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        label:
          type: string
        note:
          type: string
        x:
          type: number
          description: Fraction of the image width, 0..1.
        "y":
          type: number
          description: Fraction of the image height, 0..1.
        dmOnly:
          type: boolean
        linkMapId:
          type: string
          format: uuid
          nullable: true
          description: When set, this pin is a region marker leading into that sub-map.
        createdAt:
          type: string
          format: date-time
    MapDetail:
      type: object
      required:
        - map
        - pins
        - revealed
      properties:
        map:
          $ref: "#/components/schemas/CampaignMap"
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
        revealed:
          type: array
          description: |
            The caller's uncovered area — every circle for the DM, the union of the caller's pools for a player. Empty when fog is off.
          items:
            $ref: "#/components/schemas/RevealCircle"
    RevealCircle:
      type: object
      required:
        - x
        - "y"
        - r
      properties:
        x:
          type: number
          description: Fraction of the image width, 0..1.
        "y":
          type: number
          description: Fraction of the image height, 0..1.
        r:
          type: number
          description: Radius as a fraction of the image width.
    SubmitRevealsRequest:
      type: object
      required:
        - circles
      properties:
        note:
          type: string
          description: Optional label for the ledger ("session 12 — the road east").
        circles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RevealCircle"
    RevealBatch:
      type: object
      required:
        - id
        - note
        - poolName
        - circles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        poolName:
          type: string
        circles:
          type: integer
          description: How many circles the batch stamped.
        createdAt:
          type: string
          format: date-time
    CreateMapRequest:
      type: object
      required:
        - name
        - imageBase64
      properties:
        name:
          type: string
          minLength: 1
        imageBase64:
          type: string
          description: The image file, base64-encoded. JPEG or PNG, up to 10 MB decoded.
        parentMapId:
          type: string
          format: uuid
          nullable: true
    UpdateMapRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        parentMapId:
          type: string
          format: uuid
          nullable: true
        fogEnabled:
          type: boolean
          description: Omit to leave the fog as it is.
    MapPinInput:
      type: object
      required:
        - label
        - x
        - "y"
      properties:
        label:
          type: string
          minLength: 1
        note:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 1
        "y":
          type: number
          minimum: 0
          maximum: 1
        dmOnly:
          type: boolean
        linkMapId:
          type: string
          format: uuid
          nullable: true
    Encounter:
      type: object
      required:
        - id
        - campaignId
        - name
        - status
        - round
        - turnIndex
        - combatantCount
        - tag
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        tag:
          type: string
          description: Free-text filing for the library — a session, an act, a chapter. Empty when the encounter is unfiled.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this fight is prepared for; null when it belongs nowhere in particular.
        locationName:
          type: string
          nullable: true
          description: Display name of that place, so the library needs no second lookup.
        status:
          type: string
          description: inactive | active (plain string, validated server-side).
        round:
          type: integer
        turnIndex:
          type: integer
          description: Index into the initiative order whose turn it is.
        combatantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    Combatant:
      type: object
      required:
        - id
        - encounterId
        - kind
        - name
        - initMod
        - hpState
        - hidden
        - current
        - sortOrder
        - conditions
      properties:
        current:
          type: boolean
          description: Whether it's this combatant's turn right now (false for all when a hidden enemy is acting).
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        kind:
          type: string
          description: monster | pc | custom (plain string).
        name:
          type: string
          description: The DM sees the true label; players see the reveal label ("Unknown" until named).
        playerLabel:
          type: string
          nullable: true
          description: DM-only — what players see for this combatant.
        contentId:
          type: string
          format: uuid
          nullable: true
          description: DM-only — the Den monster this was built from.
        characterId:
          type: string
          format: uuid
          nullable: true
          description: DM-only (or the viewer's own PC) — the seated character.
        initMod:
          type: integer
        initiative:
          type: integer
          nullable: true
          description: Order value; null until rolled or typed.
        hpCurrent:
          type: integer
          nullable: true
          description: DM, or the owner of a PC combatant. Omitted for players otherwise.
        hpMax:
          type: integer
          nullable: true
        ac:
          type: integer
          nullable: true
        hpState:
          type: string
          description: healthy | bloodied | down — the only HP cue players get for others.
        hidden:
          type: boolean
          description: DM-only flag; hidden combatants are omitted from player payloads entirely.
        isMine:
          type: boolean
          description: For a player, whether this is their own PC (they may roll its initiative and see its HP).
        sortOrder:
          type: integer
        groupId:
          type: string
          format: uuid
          nullable: true
          description: Set when this combatant is one of a mob added together. Everything sharing a groupId is consecutive in the list and acts on a single turn; the tracker collapses the run into one entry.
        conditions:
          type: array
          items:
            type: string
          description: What is riding on this combatant, by canonical name ("Poisoned", "Exhaustion 3"). Everyone sees these — a hidden combatant is dropped from a player's payload entirely, so anything they can see, they can see the state of. Always present; empty when nothing ails it.
        deathSaves:
          $ref: "#/components/schemas/DeathSaves"
    DeathSaves:
      type: object
      required:
        - successes
        - failures
      description: "A dying hero's tally, 0–3 each. Present only on `pc` combatants — monsters here die when their hit points do. Party-visible: the table watches a friend bleed out together. Reset automatically the moment the hero is healed above 0."
      properties:
        successes:
          type: integer
          minimum: 0
          maximum: 3
        failures:
          type: integer
          minimum: 0
          maximum: 3
    EncounterDetail:
      type: object
      required:
        - encounter
        - combatants
      properties:
        encounter:
          $ref: "#/components/schemas/Encounter"
        combatants:
          type: array
          items:
            $ref: "#/components/schemas/Combatant"
    CreateEncounterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        tag:
          type: string
          maxLength: 60
          description: File it under a session or an act as you prepare it.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place it is prepared for. Must belong to the same campaign.
    FileEncounterRequest:
      type: object
      description: "The filing an encounter should carry, in full. This is a replacement, not a patch: an omitted tag clears the tag, an omitted or null locationId unpins the place."
      properties:
        tag:
          type: string
          maxLength: 60
        locationId:
          type: string
          format: uuid
          nullable: true
    UpdateEncounterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          description: inactive | active. Setting active triggers the fight; several may run at once. Setting inactive stands it down — the party is released and initiative is cleared, while prepared monsters stay.
        round:
          type: integer
          minimum: 1
        turnIndex:
          type: integer
          minimum: 0
    AddCombatantRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          description: monster (needs contentId) | pc (needs characterId) | custom (typed).
        contentId:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
        label:
          type: string
          description: Name for a custom line, or an override for a monster/PC.
        playerLabel:
          type: string
        hpMax:
          type: integer
        ac:
          type: integer
        initMod:
          type: integer
        hidden:
          type: boolean
        count:
          type: integer
          minimum: 1
          maximum: 12
          description: How many to add; omitted means 1. Above 1 they arrive as one GROUP — a single initiative, a single turn, numbered labels ("Skeleton 1"…) — while each keeps its own HP. Add one at a time instead if you want genuinely independent monsters. Ignored for kind=pc; a character can only be seated once.
    UpdateCombatantRequest:
      type: object
      properties:
        label:
          type: string
        playerLabel:
          type: string
        initiative:
          type: integer
          nullable: true
        hpCurrent:
          type: integer
        hpMax:
          type: integer
        ac:
          type: integer
        hidden:
          type: boolean
        conditions:
          type: array
          items:
            type: string
          description: "The conditions this combatant is under, in full — a replacement, not a patch, so an empty array clears them. Names are case-insensitive but closed: anything outside the vocabulary is a 400 rather than a chip nobody can filter on later."
        deathSaveSuccesses:
          type: integer
          minimum: 0
          maximum: 3
          description: Death-save pips, settable only on a `pc` that is at 0 hit points — the only state in which they mean anything. Healing above 0 clears both tallies on its own.
        deathSaveFailures:
          type: integer
          minimum: 0
          maximum: 3
    BestiaryEntry:
      type: object
      required:
        - id
        - title
        - identified
        - revealed
        - record
        - notes
        - canEdit
        - isDM
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The party's own name for the creature.
        identified:
          type: boolean
          description: Whether the DM has linked this sighting to a known creature.
        monsterName:
          type: string
          nullable: true
          description: The creature's true name, present once identified.
        revealed:
          type: array
          items:
            type: string
            enum:
              - defenses
              - offense
              - traits
              - lore
          description: Which record sections the DM has unveiled to the party.
        record:
          type: object
          additionalProperties:
            type: string
          description: Unveiled sections of the official stat block as rendered markdown, keyed by section. Members receive only revealed sections; the DM receives every section the creature has.
        notes:
          type: array
          items:
            $ref: "#/components/schemas/BestiaryNote"
        canEdit:
          type: boolean
          description: Whether the viewer may rename or delete this entry (creator or DM).
        isDM:
          type: boolean
          description: Whether the viewer may identify and unveil (DM only).
    BestiaryEntryInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    BestiaryEntryPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        contentId:
          type: string
          format: uuid
          description: Link to a Den monster to identify the sighting (DM only). The all-zero UUID unlinks it, returning the entry to an unknown creature.
        revealed:
          type: array
          items:
            type: string
            enum:
              - defenses
              - offense
              - traits
              - lore
          description: The full set of unveiled sections (idempotent; DM only).
    PackEntry:
      type: object
      required:
        - kind
        - name
        - data
      properties:
        kind:
          type: string
          enum:
            - class
            - species
            - background
            - subclass
            - feat
            - spell
            - item
            - monster
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 300
        data:
          type: object
          additionalProperties: true
    HomebrewImpact:
      type: object
      required:
        - byKind
      properties:
        byKind:
          type: array
          description: One row per kind you have homebrew in, with usage counts.
          items:
            type: object
            required:
              - kind
              - total
              - onMyCharacters
              - onOthersCharacters
              - inCampaigns
            properties:
              kind:
                type: string
              total:
                type: integer
              onMyCharacters:
                type: integer
                description: Entries referenced by characters you own.
              onOthersCharacters:
                type: integer
                description: Entries referenced by other players' characters.
              inCampaigns:
                type: integer
                description: Entries admitted in a campaign codex.
    HomebrewBooks:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          description: One row per (book, kind) pair present in your homebrew.
          items:
            type: object
            required:
              - kind
              - total
            properties:
              book:
                type: string
                nullable: true
                description: data.book of the entries; null for hand-scribed homebrew.
              kind:
                type: string
              total:
                type: integer
    ImportReport:
      type: object
      required:
        - created
        - updated
        - failed
        - results
      properties:
        created:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
              - kind
              - name
              - status
            properties:
              kind:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                  - created
                  - updated
                  - failed
              error:
                type: string
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal notes about the import — chiefly entries whose name shadows an SRD entry of the same kind. Packs are meant to be additive (new classes, subclasses, feats, spells), so a shadowing entry usually means a book's extra class features were pasted onto a copy of the base class; the import still succeeds, but the library will now show both.
    ChronicleEvent:
      type: object
      required:
        - id
        - kind
        - category
        - message
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: quest_posted, hero_seated, level_up, codex_enabled, xp, milestone, note…
        category:
          type: string
          description: |
            The channel a line belongs to (plain string, not an enum, to avoid a codegen name clash): dm (the DM's story notes), rules (rulings + codex changes), player (player posts), log (system happenings). Derived from kind.
        message:
          type: string
        actorName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    NodeRarity:
      type: string
      enum:
        - minor
        - keystone
    SkillTree:
      type: object
      required:
        - id
        - campaignId
        - name
        - description
        - keystonePickCost
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        keystonePickCost:
          type: integer
          description: How many picks a keystone eats (1 = gated only by the web).
        createdAt:
          type: string
          format: date-time
    SkillTreeInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        keystonePickCost:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
    SkillNode:
      type: object
      required:
        - id
        - treeId
        - name
        - description
        - rarity
        - limb
        - isEntry
      properties:
        id:
          type: string
          format: uuid
        treeId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        tradeoff:
          type: string
          nullable: true
          description: The price baked into a keystone.
        rarity:
          $ref: "#/components/schemas/NodeRarity"
        limb:
          type: string
          description: Grouping label within the web, e.g. ENTROPY.
        isEntry:
          type: boolean
          description: Pickable with no prior picks in the tree.
        posX:
          type: number
          nullable: true
        posY:
          type: number
          nullable: true
    SkillNodeInput:
      type: object
      required:
        - name
        - rarity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        tradeoff:
          type: string
          nullable: true
        rarity:
          $ref: "#/components/schemas/NodeRarity"
        limb:
          type: string
          maxLength: 40
        isEntry:
          type: boolean
          default: false
        posX:
          type: number
          nullable: true
        posY:
          type: number
          nullable: true
    SkillEdge:
      type: object
      required:
        - a
        - b
      properties:
        a:
          type: string
          format: uuid
        b:
          type: string
          format: uuid
    SkillEdgesInput:
      type: object
      required:
        - edges
      properties:
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SkillEdge"
    SkillTreeDetail:
      type: object
      required:
        - tree
        - nodes
        - edges
      properties:
        tree:
          $ref: "#/components/schemas/SkillTree"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SkillNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SkillEdge"
    CharacterTreeState:
      type: object
      required:
        - assigned
      properties:
        assigned:
          type: boolean
        tree:
          $ref: "#/components/schemas/SkillTreeDetail"
        picksGranted:
          type: integer
        picksSpent:
          type: integer
          description: Picks consumed by taken nodes (keystones may cost more).
        picksRemaining:
          type: integer
        takenNodeIds:
          type: array
          items:
            type: string
            format: uuid
    SetPactRequest:
      type: object
      required:
        - treeId
      properties:
        treeId:
          type: string
          format: uuid
    GrantPicksRequest:
      type: object
      required:
        - picks
      properties:
        picks:
          type: integer
          minimum: 1
          maximum: 10
    SpendPickRequest:
      type: object
      required:
        - nodeId
      properties:
        nodeId:
          type: string
          format: uuid
    RewardInput:
      type: object
      required:
        - type
        - label
      properties:
        type:
          $ref: "#/components/schemas/RewardType"
        label:
          type: string
          minLength: 1
        value:
          type: string
          nullable: true
    CreateQuestRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        giver:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          description: Legacy freeform place name, kept for boards that predate the location tree. Ignored when locationId is set.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this notice hangs in. Must belong to the same campaign.
        visibleToParty:
          type: boolean
          default: true
          description: Post it to the board straight away, or leave it drafted (false) until the DM reveals it.
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/RewardInput"
    UpdateQuestRequest:
      type: object
      required:
        - title
        - status
        - difficulty
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        giver:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          description: Legacy freeform place name. Ignored when locationId is set.
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The place this notice hangs in; null unpins it.
        visibleToParty:
          type: boolean
          description: Omit to leave the party-wide veil as it is.
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        status:
          $ref: "#/components/schemas/QuestStatus"
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/RewardInput"
    VisibilityScope:
      type: string
      enum:
        - party
        - character
      description: |
        Who a reveal or hide applies to. `party` sets the entity's party-wide
        veil and clears every per-hero exception — choosing the party is
        choosing everyone. `character` records an exception for one hero.
    VisibilityOverride:
      type: object
      required:
        - characterId
        - characterName
        - visible
      description: A single hero's exception to the party-wide veil.
      properties:
        characterId:
          type: string
          format: uuid
        characterName:
          type: string
        visible:
          type: boolean
    SetVisibilityRequest:
      type: object
      required:
        - scope
        - visible
      properties:
        scope:
          $ref: "#/components/schemas/VisibilityScope"
        characterId:
          type: string
          format: uuid
          nullable: true
          description: Required when scope is `character`; ignored otherwise.
        visible:
          type: boolean
          description: True reveals, false hides.
    Location:
      type: object
      required:
        - id
        - campaignId
        - name
        - description
        - depth
        - questCount
      description: |
        A place on a campaign's map. Locations nest to an arbitrary depth
        (capped at 10) — a region holds cities, a city holds districts.
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
          description: The place this one sits inside; null for a root.
        name:
          type: string
        description:
          type: string
        depth:
          type: integer
          description: 0 for a root location, 1 for its children, and so on.
        questCount:
          type: integer
          description: Notices hanging here that the caller can see.
        visibleToParty:
          type: boolean
          description: DM-only. The party-wide veil on this place.
        hiddenByAncestor:
          type: boolean
          description: DM-only. True when a place above this one is still veiled, so this one stays off the players' map however it is set.
        visibility:
          type: array
          description: DM-only. Per-hero exceptions to visibleToParty.
          items:
            $ref: "#/components/schemas/VisibilityOverride"
    CreateLocationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        visibleToParty:
          type: boolean
          default: false
          description: New places start veiled so the DM can draft a whole region first.
    UpdateLocationRequest:
      type: object
      required:
        - name
        - description
      description: |
        A place's own text, replaced. Deliberately cannot move the place: this
        endpoint used to write `parent_id` too, and because an absent field and
        an explicit null are indistinguishable once decoded, a body that only
        renamed a place detached it — taking everything nested inside it out to
        the root, and lifting the veil on any of it that was only dark because
        an ancestor was veiled. Moving is now its own call, where saying nothing
        is not a possible input.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Replaces the existing description; send the current one to keep it.
    MoveLocationRequest:
      type: object
      required:
        - parentId
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: The place this one moves inside. Null makes it a root. A place cannot be moved inside itself or inside its own descendant, and the resulting tree must still fit within the depth cap of 10.
security:
  - sessionCookie: []

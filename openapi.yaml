          application/json:
            schema:
              $ref: "#/components/schemas/CreatureInput"
      responses:
        "201":
          description: The new creature, resolved for this hero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creatures/{creatureId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
      - name: creatureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCharacterCreature
      summary: Mold a creature's numbers, track its hit points, or take the form (owner or DM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreaturePatch"
      responses:
        "200":
          description: The updated creature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCharacterCreature
      summary: Release a creature (owner or DM)
      responses:
        "204":
          description: Gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/creature-options:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      operationId: getCreatureOptions
      summary: The forms and companions this hero's own features grant
      responses:
        "200":
          description: Everything the sheet entitles this hero to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatureOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/levelup:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: levelUpCharacter
      summary: Advance a forged hero one level (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelUpRequest"
      responses:
        "200":
          description: The hero, one level mightier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/rest:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: restCharacter
      summary: Take a long or short rest (owner or DM). A long rest restores HP to full, returns every spell slot and hands back half the hero's hit dice; a short rest spends hit dice to heal and returns a pact caster's slots. The report says what actually moved, including what each die rolled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestRequest"
      responses:
        "200":
          description: What the rest restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{characterId}/spells/swap:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: swapCharacterSpells
      summary: Change prepared spells on a Long Rest (owner only). Allowed only for classes whose spellChanges rule says long-rest, and only as far as that rule permits — a Cleric re-prepares freely, a Paladin swaps one, a Bard cannot do it at all (its swap comes at level-up).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpellSwapRequest"
      responses:
        "200":
          description: The hero with its new list of spells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/events:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listEvents
      summary: The campaign chronicle, newest first (members)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: category
          in: query
          description: |
            Filter to one channel (all | dm | rules | player | log); omit or "all" for everything. Plain string, validated server-side.
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChronicleEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addChronicleNote
      summary: Write an entry into the chronicle (any member; players post to player chat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
                category:
                  type: string
                  description: |
                    The DM's channel choice — "dm" (story note) or "rules" (a ruling); defaults to dm. Ignored for players, who always post to player chat. Plain string, validated server-side.
      responses:
        "201":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChronicleEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/rolls:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: rollInTheOpen
      summary: Roll dice where the table can see them (any member)
      description: |
        The server rolls the pool and writes the result into the chronicle's rolls channel. Public rolls are rolled here rather than posted from the browser: a shared log that takes the roller's word for the number is not a record of anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollRequest"
      responses:
        "201":
          description: What the dice did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/xp:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: grantXP
      summary: Grant (or dock) XP to seated heroes (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: -100000
                  maximum: 100000
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Omit to grant to every seated hero.
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: The heroes after the grant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/milestone:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: declareMilestone
      summary: A milestone — seated heroes gain one pending level-up (DM only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 200
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Grant only to these seated heroes; omitted means the whole party.
      responses:
        "204":
          description: Declared
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/milestone/revoke:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: revokeMilestone
      summary: |
        Take back an unspent level-up (DM only) — from the chosen heroes, or one from everyone when none are named. Already-spent levels stay.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                characterIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Taken back
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/progression:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setProgression
      summary: Switch the campaign between milestone and XP progression (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - milestone
                    - xp
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/max-level:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setMaxLevel
      summary: Set or clear the table's level ceiling (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxLevel:
                  type: integer
                  minimum: 1
                  maximum: 20
                  nullable: true
                  description: Highest level heroes may reach here; null restores the standard 20.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/max-seated:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setMaxSeatedPerPlayer
      summary: Set how many heroes one player may seat at this table at once (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxSeatedPerPlayer
              properties:
                maxSeatedPerPlayer:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: |
                    Seats per player. Lowering it never unseats anyone — it only bars further seating until the player is back under the cap.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/seating-approval:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setSeatingApproval
      summary: Bar or open the table's door — barred means new heroes wait for the DM's nod (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/coinage:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setCoinage
      summary: Set the coins this table counts in (DM only)
      description: |-
        A DM names their own money (#195) — glimmer, trade bars, faction scrip — and the Bazaar prices and charges in it. Sending an empty list puts the table back on the standard cp/sp/ep/gp/pp.

        Changing the ladder does not convert anybody's purse. The numbers stand and their meaning changes, because an invented coin has no rate against the old one — so this is a thing to settle before play rather than during it, and the screen says so before it lets you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCoinageRequest"
      responses:
        "200":
          description: The campaign, counting in its new coin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{campaignId}/hidden-sheets:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      operationId: setHiddenSheets
      summary: Draw or lift the veil over the table's character sheets (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: |
                    True veils every hero from the other players — names only. False returns the party to open sheets.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /characters/{characterId}/reveal:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: revealCharacter
      summary: Lift or drop the veil on one seated hero's sheet (DM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revealed
              properties:
                revealed:
                  type: boolean
                  description: True opens this hero's sheet to the party; false veils them again.
      responses:
        "200":
          description: The hero, as the party now sees them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/seat-requests:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: listSeatRequests
      summary: The heroes waiting at the door, oldest first (DM only)
      responses:
        "200":
          description: Pending seat requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSeat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{campaignId}/seat-requests/{characterId}/approve:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: approveSeatRequest

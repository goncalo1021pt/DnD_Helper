# Continuous integration for Quest Board.
#
# Runs on every PR into main (and on pushes to main, to keep the branch green).
# Four independent jobs, matching docs/VISION.md "Post-v1 roadmap" item #1:
#   backend   — go vet + go build + go test
#   frontend  — tsc typecheck + vite build
#   codegen   — `make generate` produces no diff (spec/SQL and generated code in sync)
#   e2e       — Playwright drives the real stack (issue #105)
#
# CD is NOT here: deploys run from deploy-staging.yml / deploy-prod.yml on
# self-hosted runners inside the target VMs, so the box dials out to GitHub
# rather than GitHub reaching into a VPN. See docs/RELEASING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · vet · build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  frontend:
    name: Frontend · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` is `tsc && vite build` — the tsc step is the type check.
      - run: npm run build
      # Unit tests for the pure rules code (#112, #125). They also hold the
      # shared fixtures the Go side asserts against, so a drift between the two
      # engines fails here as well as in `go test`.
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E · Playwright smoke suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_DB: questboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U questboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://questboard:questboard@localhost:5432/questboard?sslmode=disable
      SESSION_KEY: ci-only-session-key-not-a-secret-000000000=
      APP_ENV: development
      BASE_URL: http://localhost:8080
      # No RESEND_API_KEY on purpose: the server falls back to logMailer and
      # prints what it would have sent, which is how the verification-link test
      # follows the link. With a real key this suite would email strangers.
      E2E_SERVER_LOG: ${{ github.workspace }}/server.log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      # The suite drives the real binary with the SPA embedded, exactly as
      # production serves it — same origin, same routing fallback.
      - name: Build the app
        run: make build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start the server
        run: |
          ./bin/server > "$E2E_SERVER_LOG" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done

      - name: Run the smoke suite
        run: npm run e2e
        working-directory: frontend

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            server.log
          retention-days: 7

  codegen:
    name: Codegen · make generate is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # sqlc + oapi-codegen at pinned versions (see the `tools` target in the
      # Makefile) so this drift check is deterministic across generator releases.
      # sqlc v1.31.1 needs Go >= 1.26 while our module targets 1.25; setup-go v6+
      # pins GOTOOLCHAIN=local, so allow Go to fetch the newer toolchain for the
      # tool install only.
      - name: Install codegen tools
        env:
          GOTOOLCHAIN: auto
        run: make tools
      # openapi-typescript lives in the frontend devDependencies (make gen-frontend
      # runs `npm run gen:api`).
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Regenerate from SQL + OpenAPI
        run: make generate
      - name: Fail if generated code is stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date — run 'make generate' and commit the result."
            git status --porcelain
            exit 1
          fi
  migrations:
    name: Migrations · numbered after main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: New migrations must outnumber main's latest
        run: |
          git fetch origin main
          new=$(git diff --name-only --diff-filter=A origin/main...HEAD -- backend/internal/db/migrations/)
          if [ -z "$new" ]; then echo "no new migrations"; exit 0; fi
          main_max=$(git ls-tree -r --name-only origin/main -- backend/internal/db/migrations/ \
            | grep -oE '^backend/internal/db/migrations/[0-9]{6}' | grep -oE '[0-9]{6}' | sort -n | tail -1)
          bad=0
          for f in $new; do
            n=$(basename "$f" | grep -oE '^[0-9]{6}')
            if [ "$((10#$n))" -le "$((10#$main_max))" ]; then
              echo "::error file=$f::migration $n collides with or precedes main's latest ($main_max) — renumber it"
              bad=1
            fi
          done
          exit $bad

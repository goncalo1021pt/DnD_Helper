# External uptime watch for Quest Board.
#
# This exists because the in-house monitor cannot report its own death. Grafana
# and Prometheus run on VM 200 — the production VM — so when the host crashed on
# 2026-08-18 at 08:24 and `onboot=0` left both guests stopped, the "app is DOWN"
# rule was never evaluated by anyone. The site was gone for 11.5 hours and
# nothing said a word. A watchdog sharing a power supply with the thing it
# watches is not a watchdog.
#
# GitHub runs this, so it survives the house losing power entirely — which is
# the failure that actually happens here. The repo is public, so the minutes
# are free.
#
# TWO THINGS THAT WILL BITE:
#   1. GitHub only runs `schedule:` from the DEFAULT branch. This file does
#      nothing at all until it is merged to main.
#   2. Scheduled workflows are disabled after 60 days with no repo activity.
#
# Staging is deliberately NOT watched: dnd-test.fontao.net sits behind
# Cloudflare Access, which answers an unauthenticated poller with a 302 to the
# login page. That looks healthy whatever state the app behind it is in, so
# polling it would buy a green light and no information.
name: Uptime

on:
  schedule:
    # Every 5 minutes. GitHub delays scheduled runs under load — treat this as
    # "within ~15 minutes", which is well inside the useful range for a game
    # table, and do not tighten it chasing precision it cannot give.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Never let two probes overlap; a queued one is pointless once a newer one runs.
concurrency:
  group: uptime
  cancel-in-progress: false

env:
  HEALTH_URL: https://dnd.fontao.net/api/health
  # The open issue IS the state: it is how a second failing probe knows the
  # first one already spoke. Without it a real outage sends a Discord message
  # every 5 minutes — 138 of them, for the outage that prompted this file.
  ISSUE_TITLE: "[uptime] dnd.fontao.net is DOWN"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the health endpoint
        id: probe
        run: |
          # /api/health is public and answers without a session: 200 {"status":"ok"}
          # healthy, 503 {"status":"degraded"} when the database is gone. `curl -f`
          # turns that 503 into a non-zero exit, so both failures land here.
          #
          # Three tries 20s apart, because a single miss is usually a tunnel
          # blip and waking someone for it is how alerting gets muted.
          ok=false
          detail=""
          for i in 1 2 3; do
            if body=$(curl -fsS --max-time 15 "$HEALTH_URL" 2>&1); then
              if printf '%s' "$body" | grep -q '"status":"ok"'; then
                ok=true
                break
              fi
            fi
            detail=$(printf '%s' "${body:-no response}" | tr -d '\n\r' | cut -c1-200)
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=${detail:-unreachable}" >> "$GITHUB_OUTPUT"
          echo "Probe result: ok=$ok ${detail:+($detail)}"

      - name: Find the open outage issue, if any
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ops \
                  --json number,title \
                  --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // empty")
          echo "issue=$num" >> "$GITHUB_OUTPUT"
          echo "Existing outage issue: ${num:-none}"

      # --- The site is down and nobody has been told yet ------------------
      - name: Raise the alarm
        if: steps.probe.outputs.ok == 'false' && steps.state.outputs.issue == ''
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          body=$(cat <<EOF
          Three probes of \`$HEALTH_URL\` failed, 20s apart.

          Last response: \`$DETAIL\`

          **First place to look** — is the VM even running?
          \`\`\`
          ssh pve 'qm list'
          \`\`\`
          If VM 200 is stopped, \`qm start 200\`; the containers are all
          \`restart: unless-stopped\` and come back on their own.

          Runbook: docs/RUNBOOK.md · closed automatically when the site answers again.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" --label ops --body "$body"

          # Discord needs {"content": ...} — a generic "POST the alert here"
          # payload renders as nothing at all. See docs/RUNBOOK.md.
          if [ -n "$WEBHOOK" ]; then
            jq -n --arg c "🔴 **Quest Board is DOWN** — dnd.fontao.net failed 3 health probes.
          Last response: \`$DETAIL\`
          Check the VM first: \`ssh pve 'qm list'\`" '{content: $c}' \
              | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
          else
            echo "::warning::DISCORD_WEBHOOK_URL is not set — issue raised, but nobody was pinged"
          fi

      # --- The site is back and there is an open alarm to clear -----------
      - name: Sound the all-clear
        if: steps.probe.outputs.ok == 'true' && steps.state.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE: ${{ steps.state.outputs.issue }}
        run: |
          gh issue close --repo "$GITHUB_REPOSITORY" "$ISSUE" \
            --comment "Health endpoint is answering \`{\"status\":\"ok\"}\` again. Closed by the uptime watch."
          if [ -n "$WEBHOOK" ]; then
            jq -n --arg c "🟢 **Quest Board is back** — dnd.fontao.net is answering normally again. (#$ISSUE closed)" \
              '{content: $c}' \
              | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
          fi

      # A red X in the Actions list is a second, passive signal — useful if the
      # Discord webhook is the thing that broke.
      - name: Fail the run when the site is down
        if: steps.probe.outputs.ok == 'false'
        run: |
          echo "::error::${HEALTH_URL} did not answer {\"status\":\"ok\"} after 3 attempts"
          exit 1

/campaigns/{campaignId}/search:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  get:
    operationId: searchCampaign
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:read]
    summary: Search everything a member can read at one table (#321)
    description: >-
      One box over the table's places, the Folk, quests, handouts, maps, the
      chronicle and the Bestiary, plus the rules as this table's codex rules
      them (and the Den, for its DMs). The answer is composed from the same
      list doors the screens read, called as the viewer, so a search can only
      ever find what the viewer could already read: a veiled innkeeper is not
      found, and a snippet is cut from text the viewer was already sent. A
      token without `rules:read` is answered from the table's shelves alone.
      Matching ignores case and accents; a name match ranks above a match in
      the text. At most eight hits per kind come back, and `counts` says how
      many there were in all. Fewer than two characters answers nothing.
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 100
    responses:
      "200":
        description: What the viewer can read that matches, grouped by kind
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SearchResults"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

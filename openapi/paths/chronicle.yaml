/campaigns/{campaignId}/events:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  get:
    operationId: listEvents
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:read]
    summary: The campaign chronicle, newest first (members)
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: category
        in: query
        description: >
          Filter to one channel (all | dm | rules | player | log); omit or
          "all" for everything. Plain string, validated server-side.
        schema:
          type: string
          default: all
    responses:
      "200":
        description: Events
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/ChronicleEvent"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
  post:
    operationId: addChronicleNote
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:play]
    summary: Write an entry into the chronicle (any member; players post to player chat)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                minLength: 1
                maxLength: 2000
                description: Line breaks are kept (#411).
              category:
                type: string
                description: >
                  The DM's channel choice — "dm" (story note) or "rules" (a
                  ruling); defaults to dm. Ignored for players, who always
                  post to player chat. Plain string, validated server-side.
    responses:
      "201":
        description: The entry
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ChronicleEvent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/events/{eventId}:
  parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: campaignId
      in: query
      required: true
      description: The table the line belongs to — the lens it is reached through.
      schema:
        type: string
        format: uuid
  patch:
    operationId: editChronicleEntry
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:play]
    summary: Reword a chronicle line (#411)
    description: >-
      A DM rewords their table's story notes and rulings; a player their own
      chat lines. Nobody rewords the app's record or another person's words.
      A line the caller may not reword answers 404, as one that is not there.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/EditChronicleEntryRequest"
    responses:
      "200":
        description: The line as it now reads
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ChronicleEvent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  delete:
    operationId: deleteChronicleEntry
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:play]
    summary: Strike a chronicle line (#411)
    description: >-
      A DM strikes any line at their table; a player their own chat lines.
      Striking a line undoes nothing it recorded — the XP stays granted, the
      handout stays given. A line the caller may not strike answers 404.
    responses:
      "204":
        description: Struck
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/campaigns/{campaignId}/xp:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: grantXP
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:run]
    summary: Grant (or dock) XP to seated heroes (DM only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: integer
                minimum: -100000
                maximum: 100000
              characterIds:
                type: array
                items:
                  type: string
                  format: uuid
                description: Omit to grant to every seated hero.
              reason:
                type: string
                maxLength: 200
    responses:
      "200":
        description: The heroes after the grant
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Character"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/gifts:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: giveGift
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:run]
    summary: >-
      Give items and coin to seated heroes (DM only, #394). Items stack onto a
      matching row or arrive as a new one; coin lands in the purse, which is
      made when the hero has none. Written to the chronicle unless `announce`
      is false, and told to each hero's owner as `hero.gifted`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/GiftRequest"
    responses:
      "200":
        description: The heroes after the gift
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Character"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/milestone:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: declareMilestone
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:run]
    summary: A milestone — seated heroes gain one pending level-up (DM only)
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              note:
                type: string
                maxLength: 200
              characterIds:
                type: array
                items:
                  type: string
                  format: uuid
                description: Grant only to these seated heroes; omitted means the whole party.
    responses:
      "204":
        description: Declared
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/milestone/revoke:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: revokeMilestone
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:run]
    summary: >
      Take back an unspent level-up (DM only) — from the chosen heroes, or
      one from everyone when none are named. Already-spent levels stay.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              characterIds:
                type: array
                items:
                  type: string
                  format: uuid
    responses:
      "204":
        description: Taken back
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/rolls:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: rollInTheOpen
    security:
      - sessionCookie: []
      - bearerToken: [campaigns:play]
    summary: Roll dice where the table can see them (any member)
    description: >
      The server rolls the pool and writes the result into the chronicle's
      rolls channel. Public rolls are rolled here rather than posted from the
      browser: a shared log that takes the roller's word for the number is not
      a record of anything.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RollRequest"
    responses:
      "201":
        description: What the dice did
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RollResult"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/campaigns/{campaignId}/parties:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  get:
    operationId: listParties
    summary: The parties at this table
    responses:
      "200":
        description: The campaign's parties
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Party"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
  post:
    operationId: createParty
    summary: Form a new party (DM only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PartyInput"
    responses:
      "201":
        description: The new party
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Party"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/parties/{partyId}:
  parameters:
    - name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: renameParty
    summary: Rename a party (DM only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PartyInput"
    responses:
      "200":
        description: The party as it now stands
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Party"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  delete:
    operationId: deleteParty
    summary: Disband a party (DM only)
    description: >-
      The heroes stay, and so does everything they were ever shown — a party is
      a brush, and nothing hangs on it (#232).
    responses:
      "204":
        description: Disbanded
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/characters/{characterId}/party:
  parameters:
    - name: characterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  put:
    operationId: setCharacterParty
    summary: Move a hero to a party, or out of all of them (DM only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/SetPartyRequest"
    responses:
      "200":
        description: The hero as they now stand
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Character"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

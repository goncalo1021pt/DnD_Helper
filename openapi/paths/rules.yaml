/rules/import:
  post:
    operationId: importContentPack
    summary: Batch-import a content pack as your private homebrew (upserts by name)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entries]
            properties:
              book:
                type: string
                maxLength: 80
                description: |
                  Where this pack came from. Stamped onto every entry that
                  does not name its own data.book, so imported content reads
                  as its source everywhere instead of a flat "Homebrew".
              entries:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  $ref: "../openapi.yaml#/components/schemas/PackEntry"
    responses:
      "200":
        description: Per-entry results (failures do not abort the batch)
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ImportReport"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/export:
  get:
    operationId: exportContentPack
    summary: Your homebrew as a content pack (keep it out of public repos)
    responses:
      "200":
        description: The pack
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                book:
                  type: string
                  description: |
                    Always empty on export: a collection spans many books and
                    each entry already carries its own data.book. Its presence
                    tells an importer not to stamp a source of its own.
                entries:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/PackEntry"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/homebrew/impact:
  get:
    operationId: getHomebrewImpact
    summary: What a homebrew reset would touch — counts and in-use references
    responses:
      "200":
        description: Per-kind counts of your homebrew and what references it
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/HomebrewImpact"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/homebrew/books:
  get:
    operationId: getHomebrewBooks
    summary: Your homebrew grouped by source book — the imported-packs shelf
    responses:
      "200":
        description: One row per (book, kind) pair; book is null for hand-scribed entries
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/HomebrewBooks"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/homebrew:
  delete:
    operationId: resetHomebrew
    summary: Delete your homebrew — all of it, one kind, or one book (author's own only)
    parameters:
      - name: kind
        in: query
        required: false
        description: >-
          Limit the wipe to a single content kind (class, species, background,
          subclass, feat, spell, item, monster); omit to wipe every kind.
        schema:
          type: string
      - name: book
        in: query
        required: false
        description: >-
          Limit the wipe to entries whose data.book matches — removes one
          imported pack at a time. Mutually exclusive with kind.
        schema:
          type: string
    responses:
      "200":
        description: How many entries were removed
        content:
          application/json:
            schema:
              type: object
              required: [deleted]
              properties:
                deleted:
                  type: integer
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/{kind}:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ContentKind"
  get:
    operationId: listRules
    summary: Rules content of one kind (SRD + this instance's homebrew)
    responses:
      "200":
        description: Content entries
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/RulesContent"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
  post:
    operationId: createRulesContent
    summary: Add a homebrew entry of this kind (any signed-in user)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RulesContentInput"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RulesContent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

/rules/content/{contentId}:
  parameters:
    - name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  put:
    operationId: updateRulesContent
    summary: Edit a homebrew entry (author only; SRD is immutable)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RulesContentInput"
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RulesContent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  delete:
    operationId: deleteRulesContent
    summary: Remove a homebrew entry (author only)
    responses:
      "204":
        description: Deleted
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/campaigns/{campaignId}/codex:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  get:
    operationId: getCodex
    summary: The campaign's codex — every explicit ruling plus proposals (members)
    responses:
      "200":
        description: Codex entries
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/CodexEntry"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
  post:
    operationId: proposeCodexContent
    summary: Offer your homebrew to the table (members; DM decides)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [contentIds]
            properties:
              contentIds:
                type: array
                minItems: 1
                items:
                  type: string
                  format: uuid
    responses:
      "204":
        description: Proposed
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/codex/bulk:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  post:
    operationId: setCodexStatusBulk
    summary: One verdict over many entries (DM only — pack admissions)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [contentIds, status]
            properties:
              contentIds:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: string
                  format: uuid
              status:
                type: string
                enum: [enabled, banned]
    responses:
      "204":
        description: Ruled
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/codex/{contentId}:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
    - name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  put:
    operationId: setCodexStatus
    summary: The DM's verdict on an entry (enable homebrew, ban/unban SRD)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [enabled, banned]
    responses:
      "204":
        description: Ruled
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  delete:
    operationId: clearCodexStatus
    summary: Remove a ruling — back to defaults (DM only)
    responses:
      "204":
        description: Cleared
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

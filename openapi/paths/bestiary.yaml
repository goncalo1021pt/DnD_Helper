/campaigns/{campaignId}/bestiary:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
  get:
    operationId: listBestiary
    summary: The party's field journal (members). DM sees full records; players see only unveiled sections.
    responses:
      "200":
        description: Bestiary entries
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/BestiaryEntry"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
  post:
    operationId: createBestiaryEntry
    summary: Log a new sighting (any member)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/BestiaryEntryInput"
    responses:
      "201":
        description: The new entry
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BestiaryEntry"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"

/campaigns/{campaignId}/bestiary/{entryId}:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updateBestiaryEntry
    summary: Rename a sighting (creator/DM), or identify and unveil it (DM only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/BestiaryEntryPatch"
    responses:
      "200":
        description: The updated entry
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BestiaryEntry"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  delete:
    operationId: deleteBestiaryEntry
    summary: Remove a sighting and its notes (creator/DM)
    responses:
      "204":
        description: Deleted
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/campaigns/{campaignId}/bestiary/{entryId}/notes:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: addBestiaryNote
    summary: Pen a field note on a sighting (any member)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body:
                type: string
                minLength: 1
                maxLength: 2000
    responses:
      "201":
        description: The updated entry
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BestiaryEntry"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/campaigns/{campaignId}/bestiary/{entryId}/notes/{noteId}:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/CampaignId"
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  delete:
    operationId: deleteBestiaryNote
    summary: Erase a field note (its author, or the DM)
    responses:
      "204":
        description: Deleted
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

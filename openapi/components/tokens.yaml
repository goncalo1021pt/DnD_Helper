# API tokens (#294): a door onto a person for scripts, an AI, another service.

TokenScope:
  type: string
  description: >-
    What kind of thing a token may touch — a domain and a verb (#313). `write`
    implies `read` within a domain; `campaigns` runs own > run > play > read.
    A scope says what may be reached; who the caller is to it is still decided
    at the door exactly as for a browser.
  enum:
    - rules:read
    - rules:write
    - heroes:read
    - heroes:write
    - campaigns:read
    - campaigns:play
    - campaigns:run
    - campaigns:own
    - account:read
    - account:write

ApiToken:
  type: object
  required: [id, name, prefix, scopes, createdAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    prefix:
      type: string
      description: The first characters of the secret (`qb_ab12cd34`), so a token found in the wild can be matched to its row. Nowhere near enough to use.
    scopes:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/TokenScope"
    campaignId:
      type: string
      format: uuid
      nullable: true
      description: The one table this token may reach. Absent means every table its owner sits at.
    campaignName:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      nullable: true
      description: Written at most once a minute, so a busy script costs one write rather than one per request.
    expiresAt:
      type: string
      format: date-time
      nullable: true
      description: Absent means the token never expires.
    throttledAt:
      type: string
      format: date-time
      description: When the token was last refused for going over its ceiling (#314) — a script that is looping. Written at most once a minute; absent means never.

ApiTokenInput:
  type: object
  required: [name, scopes, expiresInDays]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 60
      description: What this token is for — "the Discord bot", "my backup script".
    scopes:
      type: array
      minItems: 1
      items:
        $ref: "../openapi.yaml#/components/schemas/TokenScope"
    campaignId:
      type: string
      format: uuid
      nullable: true
      description: Restrict the token to one table you sit at. A table you do not sit at answers 404.
    expiresInDays:
      type: integer
      minimum: 0
      maximum: 365
      description: Days until the token expires; 0 means never. The profile offers 30, 90 (its default) and 365.

ApiTokenCreated:
  type: object
  required: [token, secret]
  properties:
    token:
      $ref: "../openapi.yaml#/components/schemas/ApiToken"
    secret:
      type: string
      description: "The whole token, shown this once and never again. Send it as `Authorization: Bearer <secret>`."

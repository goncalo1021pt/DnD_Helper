Friend:
  type: object
  required: [userId, name, state, direction, since]
  properties:
    userId:
      type: string
      format: uuid
    name:
      type: string
    image:
      type: string
      nullable: true
    state:
      type: string
      enum: [pending, accepted]
    direction:
      type: string
      enum: [asked, invited, mutual]
      description: >-
        `asked` — you asked them and they have not answered. `invited` — they
        asked you. `mutual` — it was accepted, and who asked stops mattering.
    since:
      type: string
      format: date-time

FriendRoll:
  type: object
  required: [friendTag, friends, blocked]
  properties:
    friendTag:
      type: string
      example: "Sam#4821"
      description: >-
        What you hand somebody so they can ask to be your friend (#387): your
        display name and four digits. Discovery is a tag you give rather than a
        search — a search box over accounts is an enumeration door onto a
        private tavern. Renaming keeps the digits unless the new name already
        wears them; drawing a new tag leaves every existing friendship alone.
    friends:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/Friend"
    blocked:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/Friend"

AskFriendRequest:
  type: object
  description: >-
    Exactly one of the two: a tag somebody handed you, or the id of somebody
    you already share a table with (#302) — the player beside you should not
    need to read you a tag. An id that is not a table-mate's answers 404, as a
    tag nobody holds does, so ids are no way to find strangers.
  properties:
    tag:
      type: string
      minLength: 6
      maxLength: 48
      example: "Sam#4821"
      description: >-
        A display name, `#`, and four digits. Case and the spaces around it do
        not matter; the name must otherwise be written as its holder wrote it.
    userId:
      type: string
      format: uuid

Message:
  type: object
  required: [id, authorId, authorName, body, createdAt, mine]
  properties:
    id:
      type: string
      format: uuid
    authorId:
      type: string
      format: uuid
    authorName:
      type: string
    body:
      type: string
    createdAt:
      type: string
      format: date-time
    mine:
      type: boolean

SendMessageRequest:
  type: object
  required: [body]
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 4000

DirectThread:
  type: object
  required: [peerId, peerName, lastBody, lastAt, lastWasMine, unread]
  properties:
    peerId:
      type: string
      format: uuid
    peerName:
      type: string
    peerImage:
      type: string
      nullable: true
    lastBody:
      type: string
    lastAt:
      type: string
      format: date-time
    lastWasMine:
      type: boolean
    unread:
      type: integer

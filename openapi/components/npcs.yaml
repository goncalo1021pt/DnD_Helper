Npc:
  type: object
  required: [id, name, description, isDM]
  description: |
    A person of the campaign, as this viewer may know them. Players are only
    ever sent NPCs their veil resolves visible — through any of their seated
    heroes, with the place tree above having the final word — so everything a
    player receives is someone they have met. The stats carry a second veil:
    `statBlock` / `characterId` are present only when the viewer may read them.
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    locationId:
      type: string
      format: uuid
      nullable: true
    locationName:
      type: string
      nullable: true
      description: The place this person is found in — null when they are filed nowhere.
    contentId:
      type: string
      format: uuid
      nullable: true
      description: DM-only. The Den monster behind this NPC, when they carry a stat block.
    statBlock:
      $ref: "../openapi.yaml#/components/schemas/RulesContent"
      nullable: true
      description: The stat block, present when the viewer may read the stats.
    characterId:
      type: string
      format: uuid
      nullable: true
      description: The character sheet behind this NPC, present when the viewer may read it.
    characterName:
      type: string
      nullable: true
    traveling:
      type: boolean
      description: >-
        Whether this person walks with the party (#228). A traveler is always
        known to the party — marking them opens that veil — and appears in the
        roster's own section, apart from the heroes and never counted among
        them.
    hpCurrent:
      type: integer
      nullable: true
      description: >-
        An ally's hit points, and their maximum below, read from whatever
        stands behind them — a forged body keeps them on its sheet, a
        stat-block person on their own row. Their condition is one of their
        numbers, so it sits behind the stats veil with the rest: absent unless
        the viewer may read them (or runs them), absent for anyone not
        traveling, and absent for a traveler with nothing behind them at all.
    hpMax:
      type: integer
      nullable: true
    control:
      type: string
      enum: [dm, player, table]
      description: >-
        DM-only. Who runs this ally — the DM alone, one named player, or the
        whole table.
    controlUserId:
      type: string
      format: uuid
      nullable: true
      description: DM-only. The player who holds them, when control is `player`.
    controlUserName:
      type: string
      nullable: true
      description: DM-only. That player's name, so the picker needs no second call.
    yoursToRun:
      type: boolean
      description: >-
        Whether this viewer may move the ally's hit points and read what stands
        behind them. True for the DM, and for whoever control names — you
        cannot play someone whose sheet you may not read, so this lifts the
        stats veil for the controller alone.
    isDM:
      type: boolean
      description: Whether the viewer may edit this NPC and work its veils.
    visibleToParty:
      type: boolean
      description: DM-only. The party-wide veil on this person.
    visibility:
      type: array
      description: DM-only. Per-hero exceptions to visibleToParty.
      items:
        $ref: "../openapi.yaml#/components/schemas/VisibilityOverride"
    statsVisibleToParty:
      type: boolean
      description: DM-only. The party-wide veil on this person's stats or sheet.
    statsVisibility:
      type: array
      description: DM-only. Per-hero exceptions to statsVisibleToParty.
      items:
        $ref: "../openapi.yaml#/components/schemas/VisibilityOverride"

NpcInput:
  type: object
  required: [name]
  description: |
    Creating or amending a person. On PATCH an absent field keeps what is
    there, like a shop's filing; `contentId` and `characterId` exclude each
    other — setting one clears the other — and either is cleared explicitly by
    sending the nil UUID (all zeros), the way the bestiary unlinks a monster.
  properties:
    name:
      type: string
    description:
      type: string
    locationId:
      type: string
      format: uuid
      nullable: true
    contentId:
      type: string
      format: uuid
      nullable: true
      description: A Den monster to stand behind this NPC — SRD or the DM's own homebrew.
    characterId:
      type: string
      format: uuid
      nullable: true
      description: >-
        A sheet forged for one of this campaign's Folk (#227) — never a seated
        hero, because a sheet makes a person statted and not a party member.
        Sending the nil UUID strikes that body: it exists only for this person
        and nothing else points at it.

NpcTravelInput:
  type: object
  required: [traveling]
  description: |
    Marking a person as walking with the party, and handing them to whoever
    runs them (#228). Traveling opens the veil on their existence in the same
    stroke — an ally the party has never heard of is a contradiction — and
    leaves the veil on their numbers exactly where the DM set it.
  properties:
    traveling:
      type: boolean
    control:
      type: string
      enum: [dm, player, table]
      description: >-
        Who runs them. Absent keeps what is there; a person who stops traveling
        goes back to the DM.
    controlUserId:
      type: string
      format: uuid
      nullable: true
      description: Required when control is `player`, and refused otherwise.

NpcHpInput:
  type: object
  required: [hpCurrent]
  description: |
    Where an ally's hit points now stand. Open to the DM and to whoever holds
    them, and to nobody else. It lands wherever that ally's points actually
    live: on the sheet for a forged body, on the person's own row for one
    carried by a stat block.
  properties:
    hpCurrent:
      type: integer
      minimum: 0

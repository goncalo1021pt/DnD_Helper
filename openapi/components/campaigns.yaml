Campaign:
  type: object
  required: [id, name, ownerUserId, createdAt, realmId, realmName]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    ownerUserId:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    realmId:
      type: string
      format: uuid
      description: >-
        The realm this campaign stands in (#233). Every campaign has one — a
        table founded on its own ground gets a realm of its own, named after
        it — so this is never absent and never null.
    realmName:
      type: string
      description: >-
        What that realm is called. It reaches everyone at the table, DM and
        player alike: the name of the setting is not a secret, and this is the
        only place a player ever reads it. Listing, renaming, moving and
        striking realms remain the owner's alone.
    inviteCode:
      type: string
      description: >
        DM-only. The code that admits anyone holding it, so it reaches the
        DM's payloads and nobody else's — it used to be required, which meant
        every player read their table's code out of `GET /campaigns` however
        carefully the screen hid it, and could hand it on after being kicked
        or banned (#207). Absent, not blank: a player has no invite code, they
        are not holding an empty one.
    nextSessionAt:
      type: string
      format: date-time
      nullable: true
      description: When the table gathers next; null when unscheduled.
    progression:
      type: string
      enum: [milestone, xp]
      description: How heroes advance at this table.
    maxLevel:
      type: integer
      nullable: true
      description: The DM's level ceiling for this table; null means the standard 20.
    requireSeatingApproval:
      type: boolean
      description: When true the door is barred — new heroes wait for the DM's approval before seating.
    maxSeatedPerPlayer:
      type: integer
      description: >
        How many heroes one player may seat at this table at once. The DM's
        dial; defaults to one. The cap holds the door — heroes already seated
        are never evicted by lowering it.
    coinage:
      type: array
      nullable: true
      description: >-
        The coins this table counts in, smallest first (#195). Null means the
        standard cp/sp/ep/gp/pp ladder, which is what every campaign had before
        a DM could say otherwise. A purse and a price are both reckoned in the
        smallest coin's units.
      items:
        $ref: "../openapi.yaml#/components/schemas/Coin"
    hiddenSheets:
      type: boolean
      description: >
        When true the veil is drawn over the table's character sheets: a
        player sees only the names of the other heroes. Owners and the DM
        always read their own sheets in full, and the DM may lift the veil
        on individual heroes.

CampaignMembership:
  type: object
  required: [campaign, role]
  properties:
    campaign:
      $ref: "../openapi.yaml#/components/schemas/Campaign"
    role:
      $ref: "../openapi.yaml#/components/schemas/Role"

Member:
  type: object
  required: [userId, name, role, joinedAt]
  properties:
    userId:
      type: string
      format: uuid
    name:
      type: string
    image:
      type: string
      nullable: true
    role:
      $ref: "../openapi.yaml#/components/schemas/Role"
    joinedAt:
      type: string
      format: date-time

Ban:
  type: object
  required: [userId, name, bannedAt]
  properties:
    userId:
      type: string
      format: uuid
    name:
      type: string
    image:
      type: string
      nullable: true
    bannedAt:
      type: string
      format: date-time

BanRequest:
  type: object
  required: [userId]
  properties:
    userId:
      type: string
      format: uuid

PendingSeat:
  type: object
  required: [characterId, name, level, ownerName, requestedAt]
  properties:
    characterId:
      type: string
      format: uuid
    name:
      type: string
    class:
      type: string
      nullable: true
    level:
      type: integer
    ownerName:
      type: string
      description: Display name of the player who knocks.
    requestedAt:
      type: string
      format: date-time

SeatPending:
  type: object
  required: [campaignId, campaignName]
  properties:
    campaignId:
      type: string
      format: uuid
    campaignName:
      type: string

MySeatRequest:
  type: object
  required: [characterId, campaignId, campaignName]
  properties:
    characterId:
      type: string
      format: uuid
    campaignId:
      type: string
      format: uuid
    campaignName:
      type: string

CreateCampaignRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    realmId:
      type: string
      format: uuid
      description: >-
        Found this campaign in a realm you already have. Omitted — the default,
        and what every table did before #233 — it gets a realm of its own,
        named after the campaign.

JoinCampaignRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 1

SetNextSessionRequest:
  type: object
  properties:
    nextSessionAt:
      type: string
      format: date-time
      nullable: true
      description: Omit or send null to clear the scheduled session.

Coin:
  type: object
  required: [name, abbrev, value]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
      description: What the coin is called — "Glimmer", "Trade Bar", "Gold Pieces".
    abbrev:
      type: string
      minLength: 1
      maxLength: 8
      description: >-
        What a price writes it as: "3 glm". Letters only, unique within the
        ladder, and matched case-insensitively.
    value:
      type: integer
      minimum: 1
      description: >-
        What one is worth in base units. The smallest coin is 1 by definition,
        so a ladder always has one rung worth exactly that.

SetCoinageRequest:
  type: object
  required: [coins]
  properties:
    coins:
      type: array
      description: >-
        The ladder, in any order — it is sorted on the way in. An empty list
        puts the table back on the standard coins.
      maxItems: 8
      items:
        $ref: "../openapi.yaml#/components/schemas/Coin"

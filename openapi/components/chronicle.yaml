ChronicleEvent:
  type: object
  required: [id, kind, category, message, createdAt]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      description: quest_posted, hero_seated, level_up, codex_enabled, xp, milestone, note…
    category:
      type: string
      description: >
        The channel a line belongs to (plain string, not an enum, to avoid
        a codegen name clash): dm (the DM's story notes), rules (rulings +
        codex changes), player (player posts), rolls (dice rolled in the
        open), log (system happenings). Derived from kind.
    message:
      type: string
    actorName:
      type: string
      nullable: true
    handoutId:
      type: string
      format: uuid
      nullable: true
      description: >
        Set on a `handout` line: the prop the DM handed over, rendered inline
        in the feed. A line whose handout is veiled from the reader is not in
        their feed at all, so this is always something they may look at.
    createdAt:
      type: string
      format: date-time

DieGroup:
  type: object
  required: [count, sides]
  properties:
    count:
      type: integer
      minimum: 1
      maximum: 100
      description: How many of this die are in the pool.
    sides:
      type: integer
      description: 2 (a coin), 4, 6, 8, 10, 12, 20 or 100.

RollRequest:
  type: object
  required: [groups]
  properties:
    groups:
      type: array
      minItems: 1
      maxItems: 8
      items:
        $ref: "../openapi.yaml#/components/schemas/DieGroup"
    modifier:
      type: integer
      minimum: -100
      maximum: 100
      default: 0
    label:
      type: string
      maxLength: 60
      description: What the roll is for — "Fireball", "a Stealth check". Optional.

RolledGroup:
  type: object
  required: [sides, results]
  properties:
    sides:
      type: integer
    results:
      type: array
      items:
        type: integer
      description: Every face that came up, in the order rolled.

RollResult:
  type: object
  required: [expression, groups, modifier, total, crit, fail]
  properties:
    expression:
      type: string
      description: How the pool is written — "2d6 + 1d8 + 3".
    groups:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/RolledGroup"
    modifier:
      type: integer
    total:
      type: integer
    crit:
      type: boolean
      description: A lone d20 that landed on 20.
    fail:
      type: boolean
      description: A lone d20 that landed on 1.

GiftItem:
  type: object
  description: One line of a gift — a library item or a written-in name.
  properties:
    contentId:
      type: string
      format: uuid
      description: An armory item. Homebrew must be admitted by the table's codex.
    name:
      type: string
      maxLength: 80
      description: A written-in item, when there is no `contentId`.
    qty:
      type: integer
      minimum: 1
      maximum: 999
      description: How many; one when left out.

GiftRequest:
  type: object
  required: [heroIds]
  description: At least one of `items` and `coin` must be given.
  properties:
    heroIds:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: string
        format: uuid
      description: Seated heroes. Every one receives the whole gift.
    items:
      type: array
      maxItems: 30
      items:
        $ref: "../openapi.yaml#/components/schemas/GiftItem"
    coin:
      type: string
      maxLength: 80
      description: >-
        An amount in the table's coin, such as "50 gp" or "2 gp, 5 sp" — parts
        separated by commas, each a number and one of the ladder's coins. A
        remainder below the smallest coin rounds up.
    note:
      type: string
      maxLength: 200
      description: A line of colour for the chronicle ("found in the vault").
    startingPack:
      type: string
      maxLength: 80
      description: >-
        Set when the gift is a hero's starting pack (#390), naming it ("Fighter
        A + Soldier"). It stamps the heroes as having been given one and says so
        in the chronicle line.
    announce:
      type: boolean
      description: >-
        Whether the table reads the gift in the chronicle — it does when left
        out. The hero's owner is
        always told, so a ring slipped to the rogue can stay between the two.


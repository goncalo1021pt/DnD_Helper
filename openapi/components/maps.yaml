CampaignMap:
  type: object
  required: [id, campaignId, name, fogEnabled, width, height, createdAt]
  properties:
    id:
      type: string
      format: uuid
    campaignId:
      type: string
      format: uuid
    parentMapId:
      type: string
      format: uuid
      nullable: true
      description: The map this one details; null for an overworld.
    name:
      type: string
    fogEnabled:
      type: boolean
      description: When true, players see only what their reveal circles uncover.
    width:
      type: integer
      description: Pixel width of the stored image.
    height:
      type: integer
    createdAt:
      type: string
      format: date-time
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place this map depicts, when it depicts one (#229).
    locationName:
      type: string
      nullable: true

MapPin:
  type: object
  required: [id, mapId, label, note, x, y, dmOnly, createdAt]
  properties:
    id:
      type: string
      format: uuid
    mapId:
      type: string
      format: uuid
    label:
      type: string
    note:
      type: string
    x:
      type: number
      description: Fraction of the image width, 0..1.
    y:
      type: number
      description: Fraction of the image height, 0..1.
    dmOnly:
      type: boolean
    linkMapId:
      type: string
      format: uuid
      nullable: true
      description: When set, this pin is a region marker leading into that sub-map.
    createdAt:
      type: string
      format: date-time

MapDetail:
  type: object
  required: [map, pins, revealed]
  properties:
    map:
      $ref: "../openapi.yaml#/components/schemas/CampaignMap"
    pins:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/MapPin"
    revealed:
      type: array
      description: >
        The caller's uncovered area — every circle for the DM, the union
        of the caller's pools for a player. Empty when fog is off.
      items:
        $ref: "../openapi.yaml#/components/schemas/RevealCircle"

RevealCircle:
  type: object
  required: [x, y, r]
  properties:
    x:
      type: number
      description: Fraction of the image width, 0..1.
    y:
      type: number
      description: Fraction of the image height, 0..1.
    r:
      type: number
      description: Radius as a fraction of the image width.

SubmitRevealsRequest:
  type: object
  required: [circles]
  properties:
    note:
      type: string
      description: Optional label for the ledger ("session 12 — the road east").
    locationId:
      type: string
      format: uuid
      nullable: true
      description: >
        Tie this batch to a place. Its ground then lifts only for a hero the
        place's veil already admits — which is how a player who grew up in a
        city starts knowing it. Omit for a batch the whole pool has.
    circles:
      type: array
      minItems: 1
      items:
        $ref: "../openapi.yaml#/components/schemas/RevealCircle"

SetRevealLocationRequest:
  type: object
  properties:
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place gating this batch; null cuts it loose to the pool.

RevealBatch:
  type: object
  required: [id, note, poolName, circles, createdAt]
  properties:
    id:
      type: string
      format: uuid
    note:
      type: string
    poolName:
      type: string
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place whose veil gates this batch; absent when none does.
    locationName:
      type: string
      description: Name of that place, for the ledger. Empty when there is none.
    circles:
      type: integer
      description: How many circles the batch stamped.
    createdAt:
      type: string
      format: date-time

CreateMapRequest:
  type: object
  required: [name, imageBase64]
  properties:
    name:
      type: string
      minLength: 1
    imageBase64:
      type: string
      description: The image file, base64-encoded. JPEG or PNG, up to 10 MB decoded.
    parentMapId:
      type: string
      format: uuid
    locationId:
      type: string
      format: uuid
      description: The place this map depicts, when it depicts one (#229).
      nullable: true

UpdateMapRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
    parentMapId:
      type: string
      format: uuid
      nullable: true
    fogEnabled:
      type: boolean
      description: Omit to leave the fog as it is.
    locationId:
      type: string
      format: uuid
      nullable: true
      description: >-
        The place this map depicts. Omitted means unchanged — like a shop, a
        map cannot be quietly unfiled by a request that says nothing.

MapPinInput:
  type: object
  required: [label, x, y]
  properties:
    label:
      type: string
      minLength: 1
    note:
      type: string
    x:
      type: number
      minimum: 0
      maximum: 1
    y:
      type: number
      minimum: 0
      maximum: 1
    dmOnly:
      type: boolean
    linkMapId:
      type: string
      format: uuid
      nullable: true

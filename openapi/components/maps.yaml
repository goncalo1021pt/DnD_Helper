CampaignMap:
  type: object
  required: [id, campaignId, realmId, name, fogEnabled, width, height, createdAt]
  properties:
    id:
      type: string
      format: uuid
    campaignId:
      type: string
      format: uuid
    realmId:
      type: string
      format: uuid
      description: >-
        The realm this stands on (#234) — the ground shared by every campaign
        founded there. `campaignId` is the lens it was read through.
    parentMapId:
      type: string
      format: uuid
      nullable: true
      description: The map this one details; null for an overworld.
    name:
      type: string
    fogEnabled:
      type: boolean
      description: When true, players see only what their reveal circles uncover.
    width:
      type: integer
      description: Pixel width of the stored image.
    height:
      type: integer
    createdAt:
      type: string
      format: date-time
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place this map depicts, when it depicts one (#229).
    locationName:
      type: string
      nullable: true
    visibleToParty:
      type: boolean
      description: >-
        Whether the whole table may know this map exists (#276). Absent from a
        player's payload — a veiled map never reaches them at all, and the
        state of the veil is the DM's business.
    visibilityOverrides:
      type: array
      description: >-
        Heroes singled out against the party-wide flag. DM only, like the
        invite code: absent rather than empty for a player.
      items:
        $ref: "../openapi.yaml#/components/schemas/VisibilityOverride"

MapPin:
  type: object
  required: [id, mapId, label, note, x, y, dmOnly, createdAt]
  properties:
    id:
      type: string
      format: uuid
    mapId:
      type: string
      format: uuid
    label:
      type: string
    note:
      type: string
    x:
      type: number
      description: Fraction of the image width, 0..1.
    y:
      type: number
      description: Fraction of the image height, 0..1.
    dmOnly:
      type: boolean
    shape:
      type: string
      enum: [pin, circle, square, diamond, triangle, star, cross, skull]
      description: >-
        What the marker looks like (#262). `pin` is the teardrop every pin was
        before shapes existed, and remains the default.
    linkMapId:
      type: string
      format: uuid
      nullable: true
      description: When set, this pin is a region marker leading into that sub-map.
    createdAt:
      type: string
      format: date-time

MapDetail:
  type: object
  required: [map, pins, shapes, revealed]
  properties:
    map:
      $ref: "../openapi.yaml#/components/schemas/CampaignMap"
    pins:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/MapPin"
    shapes:
      type: array
      description: >
        Roads and regions drawn on this map (#262), filtered for the caller
        exactly as pins are: a DM-only shape is absent from a player's payload,
        and under fog a line comes back clipped to the stretches standing on
        ground they have uncovered.
      items:
        $ref: "../openapi.yaml#/components/schemas/MapShape"
    revealed:
      type: array
      description: >
        The caller's uncovered area — every circle for the DM; for a player,
        every circle stamped for the whole table plus every circle stamped
        while one of their own heroes stood in the party (#232). Empty when
        fog is off.
      items:
        $ref: "../openapi.yaml#/components/schemas/RevealCircle"

RevealCircle:
  type: object
  required: [x, y, r]
  properties:
    x:
      type: number
      description: Fraction of the image width, 0..1.
    y:
      type: number
      description: Fraction of the image height, 0..1.
    r:
      type: number
      description: Radius as a fraction of the image width.

SubmitRevealsRequest:
  type: object
  required: [circles]
  properties:
    note:
      type: string
      description: Optional label for the ledger ("session 12 — the road east").
    locationId:
      type: string
      format: uuid
      nullable: true
      description: >
        Tie this batch to a place. Its ground then lifts only for a hero the
        place's veil already admits — which is how a player who grew up in a
        city starts knowing it. Omit for a batch nothing further gates.
    partyId:
      type: string
      format: uuid
      nullable: true
      description: >
        Stamp this for one party rather than the whole table (#232). The heroes
        riding with it *at this moment* are recorded on the batch, so the
        ground belongs to them from then on — moving between parties never
        takes it away, and joining one never hands it over.
    circles:
      type: array
      minItems: 1
      items:
        $ref: "../openapi.yaml#/components/schemas/RevealCircle"

SetRevealLocationRequest:
  type: object
  properties:
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place gating this batch; null cuts it loose again.

RevealBatch:
  type: object
  required: [id, note, partyName, heroCount, circles, createdAt]
  properties:
    id:
      type: string
      format: uuid
    note:
      type: string
    partyName:
      type: string
      description: >-
        The party this was stamped for, as a label for the ledger only —
        empty when it was stamped for the whole table, and empty again if that
        party is later disbanded. What the ground is actually gated on is the
        heroes recorded below, never the party (#232).
    heroCount:
      type: integer
      description: >-
        How many heroes were standing in that party when the stamp was made.
        Zero means the whole table. This is the gate: a hero who moves to
        another party keeps the ground they walked, and one who joins later
        does not inherit it.
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The place whose veil gates this batch; absent when none does.
    locationName:
      type: string
      description: Name of that place, for the ledger. Empty when there is none.
    circles:
      type: integer
      description: How many circles the batch stamped.
    createdAt:
      type: string
      format: date-time

CreateMapRequest:
  type: object
  required: [name, imageBase64]
  properties:
    name:
      type: string
      minLength: 1
    imageBase64:
      type: string
      description: The image file, base64-encoded. JPEG or PNG, up to 10 MB decoded.
    parentMapId:
      type: string
      format: uuid
    locationId:
      type: string
      format: uuid
      description: The place this map depicts, when it depicts one (#229).
      nullable: true
    visibleToParty:
      type: boolean
      description: >-
        Whether the table may see it straight away. Defaults to false — a map
        is the DM's until they hang it in the hall (#276).

UpdateMapRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
    parentMapId:
      type: string
      format: uuid
      nullable: true
    fogEnabled:
      type: boolean
      description: Omit to leave the fog as it is.
    locationId:
      type: string
      format: uuid
      nullable: true
      description: >-
        The place this map depicts. Omitted means unchanged — like a shop, a
        map cannot be quietly unfiled by a request that says nothing.

MapPinInput:
  type: object
  required: [label, x, y]
  properties:
    label:
      type: string
      minLength: 1
    note:
      type: string
    x:
      type: number
      minimum: 0
      maximum: 1
    y:
      type: number
      minimum: 0
      maximum: 1
    dmOnly:
      type: boolean
    shape:
      type: string
      enum: [pin, circle, square, diamond, triangle, star, cross, skull]
      description: >-
        What the marker looks like (#262). `pin` is the teardrop every pin was
        before shapes existed, and remains the default.
    linkMapId:
      type: string
      format: uuid
      nullable: true

MapPoint:
  type: object
  required: [x, y]
  properties:
    x:
      type: number
      description: Fraction of the image width, 0..1.
    y:
      type: number
      description: Fraction of the image height, 0..1.

MapShape:
  type: object
  required: [id, mapId, kind, label, points, color, dashed, width, opacity, dmOnly, createdAt]
  properties:
    id:
      type: string
      format: uuid
    mapId:
      type: string
      format: uuid
    kind:
      type: string
      enum: [line, area]
      description: >-
        `line` is stroked along its points — a road, a street, a river.
        `area` is filled between them — a kingdom, a district, a region.
        The two are one table because they are one gesture (#262).
    label:
      type: string
    points:
      type: array
      description: >-
        The run of points, in order, as fractions of the image — the same
        normalisation a pin's x/y uses, so a shape survives the map being
        re-hung at another size. An `area` closes itself; the first point is
        not repeated at the end.
      items:
        $ref: "../openapi.yaml#/components/schemas/MapPoint"
    color:
      type: string
      description: '#rrggbb — the stroke of a line, the fill of an area.'
    dashed:
      type: boolean
    width:
      type: number
      description: >-
        Stroke width as a fraction of the image width, so it scales with the
        map: a width in pixels would be a hair on one map and a river on another.
    opacity:
      type: number
      description: Fill opacity for an area, 0..1. Ignored by a line.
    dmOnly:
      type: boolean
    locationId:
      type: string
      format: uuid
      nullable: true
      description: >-
        The place this shape depicts, if any. Tint Barovia, and clicking it
        opens Barovia. Losing the place dims the link, never the drawing.
    locationName:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

MapShapeInput:
  type: object
  required: [kind, points]
  properties:
    kind:
      type: string
      enum: [line, area]
    label:
      type: string
      maxLength: 80
    points:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/MapPoint"
    color:
      type: string
    dashed:
      type: boolean
    width:
      type: number
    opacity:
      type: number
    dmOnly:
      type: boolean
    locationId:
      type: string
      format: uuid
      nullable: true
      description: The nil UUID detaches the place, as everywhere else in this API.

NotificationSettings:
  type: object
  description: >
    What reaches a person outside the app (#316). Email goes to the account's
    confirmed address; a Discord channel of their own is a webhook with
    `format: discord`. A new account is told about the next gathering and a
    handout to them, and nothing else, until it says otherwise.
  required: [emailEvents, digestEvents, digestHour, emailVerified, mutedCampaignIds]
  properties:
    emailEvents:
      type: array
      description: The catalogue names emailed as they happen; empty means none.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    digestEvents:
      type: array
      description: >
        The catalogue names emailed once a day instead (#339), in one message
        with a section per table. Never overlaps `emailEvents`. Nobody is
        subscribed to a digest they did not choose.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    digestHour:
      type: integer
      minimum: 0
      maximum: 23
      description: The hour the digest is sent at, in UTC.
    emailAddress:
      type: string
      description: Where they go. Absent when the account has no address.
    emailVerified:
      type: boolean
      description: >
        Nothing is sent to an address that has not been confirmed, whatever
        emailEvents says — the preferences are kept for when it is.
    mutedCampaignIds:
      type: array
      description: Tables muted with `PUT /campaigns/{id}/mute` — no email about them.
      items:
        type: string
        format: uuid

NotificationSettingsInput:
  type: object
  required: [emailEvents]
  properties:
    emailEvents:
      type: array
      description: >
        The catalogue names to be emailed about as they happen; empty for none.
        `chronicle.written` is not offered immediately — a line per line is a
        flood — and is refused with 400; put it in `digestEvents`.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    digestEvents:
      type: array
      description: >
        The names to be emailed once a day. Absent leaves the list as it is,
        so a script that only sets `emailEvents` keeps working. A name in both
        lists is refused with 400.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    digestHour:
      type: integer
      minimum: 0
      maximum: 23
      description: The UTC hour of the digest. Absent leaves it as it is.

TableChannelInput:
  type: object
  required: [url, events]
  properties:
    cadence:
      $ref: "../openapi.yaml#/components/schemas/WebhookCadence"
      description: Absent means `immediate`.
    digestHour:
      type: integer
      minimum: 0
      maximum: 23
      description: The UTC hour of a `daily` channel. Absent means 18.
    url:
      type: string
      description: A Discord incoming-webhook URL, or any URL that accepts a Discord-shaped message.
    events:
      type: array
      description: >
        The catalogue names to post; empty means every one the whole table
        may hear. Whatever is named, the channel only ever receives an event
        whose audience is the entire table.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"

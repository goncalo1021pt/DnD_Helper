WebhookFormat:
  type: string
  description: >
    What a hook receives (#316): `questboard` is the signed catalogue envelope;
    `discord` is a message shaped for a Discord incoming webhook, unsigned,
    with no secret to keep.
  enum: [questboard, discord]

WebhookCadence:
  type: string
  description: >
    When a hook is told (#339). `immediate` is one message per event as it
    happens. `daily` holds the events and sends one message a day at the
    hook's `digestHour`, with nothing sent on a day with nothing in it. Only a
    `discord` hook may be daily — a script wants each event as it happens.
  enum: [immediate, daily]

Webhook:
  type: object
  description: >
    A standing order (#295): tell this URL when these events happen. It belongs
    to a person and hears only what that person could see in the app — the
    audience the emitter decided is the only gate.
  required: [id, url, format, cadence, digestHour, events, createdAt, failures]
  properties:
    id:
      type: string
      format: uuid
    url:
      type: string
    format:
      $ref: "../openapi.yaml#/components/schemas/WebhookFormat"
    cadence:
      $ref: "../openapi.yaml#/components/schemas/WebhookCadence"
    digestHour:
      type: integer
      minimum: 0
      maximum: 23
      description: The hour of the daily digest, in UTC. Meaningful only when `cadence` is `daily`.
    events:
      type: array
      description: The catalogue names it wants; empty means every one.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    campaignId:
      type: string
      format: uuid
      description: The one table it hears; absent means every table its owner sits at.
    campaignName:
      type: string
    scopes:
      type: array
      description: >
        Present on a hook born of an API token: the token's scopes, which the
        hook may never hear past. Absent on one made in a browser.
      items:
        $ref: "../openapi.yaml#/components/schemas/TokenScope"
    createdAt:
      type: string
      format: date-time
    lastDeliveredAt:
      type: string
      format: date-time
    failures:
      type: integer
      description: Deliveries that died in a row; at eight the hook is disabled.
    disabledAt:
      type: string
      format: date-time
    disabledReason:
      type: string

WebhookInput:
  type: object
  required: [url, events]
  properties:
    url:
      type: string
      description: >
        Where to POST. In production it must be https and must not resolve to
        a private, loopback or link-local address — this server sits on a LAN
        and must not be turned into a probe of it.
    format:
      $ref: "../openapi.yaml#/components/schemas/WebhookFormat"
      description: Absent means `questboard`.
    cadence:
      $ref: "../openapi.yaml#/components/schemas/WebhookCadence"
      description: Absent means `immediate`. `daily` is refused (400) on a `questboard` hook.
    digestHour:
      type: integer
      minimum: 0
      maximum: 23
      description: The UTC hour a `daily` hook is sent at. Absent means 18.
    events:
      type: array
      description: The catalogue names to hear; empty means every one.
      items:
        $ref: "../openapi.yaml#/components/schemas/EventName"
    campaignId:
      type: string
      format: uuid
      nullable: true
      description: Confine it to one table you sit at. A table you do not answers 404.

WebhookCreated:
  type: object
  required: [webhook, secret]
  properties:
    webhook:
      $ref: "../openapi.yaml#/components/schemas/Webhook"
    secret:
      type: string
      description: >
        The signing secret, shown this once and never again. Verify
        `X-QuestBoard-Signature` with it. A `discord` hook is unsigned and
        gets none: empty.

WebhookDelivery:
  type: object
  description: One attempt to reach the URL, and where it stands.
  required: [id, name, attempts, createdAt, body, carries]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      description: The event name, `ping`, or `digest` for a daily digest.
    carries:
      type: integer
      description: How many events this delivery carries — 1, except a digest.
    attempts:
      type: integer
    createdAt:
      type: string
      format: date-time
    deliveredAt:
      type: string
      format: date-time
    deadAt:
      type: string
      format: date-time
      description: Set when the last retry failed; five attempts, then dead.
    nextAttemptAt:
      type: string
      format: date-time
      description: When the next try is due, while it is still being tried.
    lastStatus:
      type: integer
      description: The HTTP status of the last attempt, when one answered.
    lastError:
      type: string
    body:
      type: object
      description: The envelope exactly as sent.
      additionalProperties: true

WebhookEnvelope:
  type: object
  description: >
    What a receiver gets — the catalogue envelope without the audience, plus
    the table's name. A ping carries `name: ping` and no campaign. Signed:
    `X-QuestBoard-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + body)>`,
    with `X-QuestBoard-Timestamp` (unix seconds), `X-QuestBoard-Event` and
    `X-QuestBoard-Delivery` beside it.
  required: [id, name, at, payload]
  properties:
    id:
      type: string
      format: uuid
      description: The event's id — the same across every hook it reached, so a receiver can de-duplicate.
    name:
      type: string
    at:
      type: string
      format: date-time
    campaign:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    actor:
      $ref: "../openapi.yaml#/components/schemas/EventActor"
    payload:
      type: object
      additionalProperties: true

WebhookPing:
  type: object
  required: [deliveryId]
  properties:
    deliveryId:
      type: string
      format: uuid

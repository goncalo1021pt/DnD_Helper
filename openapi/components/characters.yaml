CharacterClass:
  type: object
  required: [classId, className, level]
  description: |
    One class a hero holds levels in. A Rogue 5 / Wizard 3 has two of these,
    each with its own subclass — a roguish archetype and an arcane tradition
    are not interchangeable, so the subclass belongs to the class rather than
    to the hero.
  properties:
    classId:
      type: string
      format: uuid
    className:
      type: string
    level:
      type: integer
      minimum: 1
      maximum: 20
      description: Levels in THIS class, not the hero's total.
    subclassId:
      type: string
      format: uuid
      nullable: true
    subclassName:
      type: string
      nullable: true
    starting:
      type: boolean
      description: True for the class the hero began as — the one granting full starting proficiencies.

Character:
  type: object
  required:
    [id, ownerUserId, ownerName, name, class, level, hpCurrent, hpMax, createdAt, mine, tableBorn, kind]
  properties:
    id:
      type: string
      format: uuid
    campaignId:
      type: string
      format: uuid
      nullable: true
      description: The campaign this hero is seated at; null while in My Heroes.
    campaignName:
      type: string
      nullable: true
      description: Name of the seated campaign, when known.
    ownerUserId:
      type: string
      format: uuid
    ownerName:
      type: string
      description: Display name of the member who plays this character.
    name:
      type: string
    class:
      type: string
      description: 'Freeform class/ancestry line, e.g. "Half-Elf Bard".'
    hitDice:
      type: array
      description: >
        Hit dice by die type, already resolved: the maximum from the hero's
        class levels, used from what they have spent. Pooled per die, because
        a level 5 Cleric / level 5 Paladin has five d8 and five d10 and
        spending one must not consume the other (PHB 2024, p.44). A hero with
        no class content has their level in d8.
      items:
        $ref: "../openapi.yaml#/components/schemas/HitDicePool"
    level:
      type: integer
    hpCurrent:
      type: integer
    hpMax:
      type: integer
    createdAt:
      type: string
      format: date-time
    mine:
      type: boolean
      description: True when the caller owns this character.
    kind:
      type: string
      enum: [hero, npc]
      description: >
        What this sheet is. `hero` is somebody's character, seated or on their
        shelf. `npc` is a body (#227) — a sheet forged for one of the Folk on
        the Folk page: never on a roster, never counted, and read through that
        person's veils rather than the table's sheet veil (#267).
    tableBorn:
      type: boolean
      description: >
        Born of a quick-add on a campaign roster: lives and dies with the
        table, never listed in My Heroes, never seated elsewhere. Account
        heroes are the opposite — the roster may only unseat them.
    partyId:
      type: string
      format: uuid
      nullable: true
      description: >-
        The party this hero rides with (#232), or null for one who rides with
        none yet. Nothing is gated on it: it decides how the roster groups and
        who a party-wide grant paints, never what this hero may see.
    partyName:
      type: string
      nullable: true
    xp:
      type: integer
      description: Experience points (XP-mode campaigns; advisory).
    pendingLevels:
      type: integer
      description: Milestone level-ups waiting to be taken.
    pregen:
      type: boolean
      description: >
        True when this hero was offered as a pre-made pregen (#180) — either
        waiting in a one-shot's pool (owned by the DM who offered it) or claimed
        and now played by a member. Lets the roster mark a claimed pregen and
        offer to release it back to the pool.
    concealed:
      type: boolean
      description: >
        True when the table's veil hides this hero from the caller. Only
        the name (and who plays them) is real — class, level, HP and the
        sheet come back emptied, and the full sheet is refused.
    revealed:
      type: boolean
      description: >
        True when the DM has lifted the veil on this hero, so the party
        reads their sheet even while the table's sheets are veiled. Only
        meaningful on a veiled table.
    sheet:
      $ref: "../openapi.yaml#/components/schemas/CharacterSheet"

CharacterSheet:
  type: object
  description: Present only on wizard-forged heroes.
  required: [abilities, skills]
  properties:
    abilities:
      $ref: "../openapi.yaml#/components/schemas/AbilityScores"
    skills:
      type: array
      items:
        type: string
    classId:
      type: string
      format: uuid
      nullable: true
      description: >
        The class this hero *started* as — the one they take full starting
        proficiencies from (PHB 2024, p.44). For everything level-related see
        `classes`, which is the whole list; this is not a copy of its first
        entry, it is a different fact that happens to agree on day one.
    speciesId:
      type: string
      format: uuid
      nullable: true
    backgroundId:
      type: string
      format: uuid
      nullable: true
    subclassId:
      type: string
      format: uuid
      nullable: true
      description: The starting class's subclass. Per-class subclasses are in `classes`.
    classes:
      type: array
      description: >
        Every class this hero holds levels in, starting class first. Their
        levels sum to `level`. Empty for a quick-add hero, who has a freeform
        `class` line and no content behind it.
      items:
        $ref: "../openapi.yaml#/components/schemas/CharacterClass"
    feats:
      type: array
      items:
        type: string
    speciesChoices:
      $ref: "../openapi.yaml#/components/schemas/SpeciesChoices"
      description: The species picks made at creation, keyed by choice id.
    spellcastingAbility:
      type: string
      description: Present on casters (STR…CHA).
    spellSlots:
      type: array
      description: >
        Present on casters — max and used per spell level. For a hero casting
        from more than one class this is the shared pool off the Multiclass
        Spellcaster table, read at their combined caster level (PHB 2024,
        p.44). Pact Magic is not in here; see `pactSlots`.
      items:
        $ref: "../openapi.yaml#/components/schemas/SpellSlot"
    pactSlots:
      $ref: "../openapi.yaml#/components/schemas/SpellSlot"
      description: >
        Pact Magic, which is its own pool: N slots all at one level, back on a
        short rest. Absent unless the hero has Warlock levels. Either pool may
        cast the other's prepared spells, but they are never added together.
    pools:
      type: array
      description: >-
        The hero's resource pools — Rages, Channel Divinity, Focus Points —
        already resolved: max computed from the granting content and the
        hero's level, used read from what they have spent.
      items:
        $ref: "../openapi.yaml#/components/schemas/ResourcePool"

SpeciesChoices:
  type: object
  description: >-
    Species picks keyed by the choice id declared in the species entry's
    data, each holding the chosen option names.
  additionalProperties:
    type: array
    items:
      type: string

SpellSlot:
  type: object
  required: [level, max, used]
  properties:
    level: { type: integer, minimum: 1, maximum: 9 }
    max: { type: integer, minimum: 0 }
    used: { type: integer, minimum: 0 }

ResourcePool:
  type: object
  required: [name, max, used, grantedBy, shortRest]
  properties:
    name:
      type: string
      description: The pool's name as the granting content declares it — "Rages".
    max:
      type: integer
      minimum: 0
    used:
      type: integer
      minimum: 0
    grantedBy:
      type: string
      description: Name of the content entry that grants this pool — "Barbarian".
    shortRest:
      type: string
      enum: [none, one, all]
      description: >-
        What a short rest gives back — nothing, one use, or everything.
        A long rest always refills the pool.

PoolsInput:
  type: object
  required: [used]
  properties:
    used:
      type: object
      description: >-
        Uses spent per pool, keyed by pool name. The map is the whole
        state — a pool missing from it is unspent.
      additionalProperties:
        type: integer
        minimum: 0

AbilityScores:
  type: object
  required: [str, dex, con, int, wis, cha]
  properties:
    str: { type: integer, minimum: 3, maximum: 30 }
    dex: { type: integer, minimum: 3, maximum: 30 }
    con: { type: integer, minimum: 3, maximum: 30 }
    int: { type: integer, minimum: 3, maximum: 30 }
    wis: { type: integer, minimum: 3, maximum: 30 }
    cha: { type: integer, minimum: 3, maximum: 30 }

ForgeRequest:
  type: object
  required: [name, classId, speciesId, backgroundId, abilities, skills]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    classId:
      type: string
      format: uuid
    speciesId:
      type: string
      format: uuid
    backgroundId:
      type: string
      format: uuid
    abilities:
      $ref: "../openapi.yaml#/components/schemas/AbilityScores"
      description: Final scores, background bonuses already applied.
    skills:
      type: array
      items:
        type: string
      description: Chosen class skills (background skills are implied).
    spells:
      type: array
      items:
        type: string
        format: uuid
      description: Level-1 spell picks (casters only; cantrips included).
    gear:
      type: string
      maxLength: 1
      description: >-
        Starting-equipment option label (A/B/C) from the class's
        startingEquipment data. The server stocks the inventory: listed
        items (linked to armory content where names match), gold as a
        Gold Pieces row, plus the background's equipment items.
    speciesChoices:
      $ref: "../openapi.yaml#/components/schemas/SpeciesChoices"
      description: >-
        One entry per choice the species offers, keyed by choice id — an
        Elf's lineage, a Gnome's Forest-or-Rock, a Human's free skill and
        Origin feat. Every offered choice must be answered.

CharacterInput:
  type: object
  required: [name, level, hpCurrent, hpMax]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    class:
      type: string
      maxLength: 80
    level:
      type: integer
      minimum: 1
      maximum: 20
    hpCurrent:
      type: integer
      minimum: 0
    hpMax:
      type: integer
      minimum: 1

SeatRequest:
  type: object
  properties:
    campaignId:
      type: string
      format: uuid
      nullable: true
      description: Omit or null to unseat the hero back to My Heroes.

PregenOffer:
  type: object
  required: [characterId]
  properties:
    characterId:
      type: string
      format: uuid
      description: >-
        One of the DM's own unseated heroes to offer into this campaign's
        pregen pool (#180).

SpellSwap:
  type: object
  description: One spell traded for another; both must be the same kind (cantrip for cantrip).
  required: [replace, with]
  properties:
    replace:
      type: string
      format: uuid
      description: A spell the hero currently knows.
    with:
      type: string
      format: uuid
      description: Its replacement, legal for the class and the hero's level.

SpellSwapRequest:
  type: object
  required: [swaps]
  properties:
    swaps:
      type: array
      minItems: 1
      items:
        $ref: "../openapi.yaml#/components/schemas/SpellSwap"

HitDicePool:
  type: object
  required: [die, max, used]
  properties:
    die:
      type: integer
      description: The die size — 6, 8, 10 or 12.
    max:
      type: integer
      minimum: 0
    used:
      type: integer
      minimum: 0

LevelUpRequest:
  type: object
  required: [hpMode]
  properties:
    classId:
      type: string
      format: uuid
      description: >
        Which class takes the level. Omit to advance the hero's only class;
        required once they hold more than one. Naming a class they do not yet
        have is how a hero multiclasses, and is refused unless they meet its
        prerequisite — 13+ in the primary ability of the new class and of
        every class they already hold (PHB 2024, p.44).
    hpMode:
      type: string
      enum: [average, roll]
    hpRoll:
      type: integer
      minimum: 1
      maximum: 12
      description: The hit-die result when hpMode is roll.
    subclassId:
      type: string
      format: uuid
      description: Required when the new level is the class's subclass level.
    featId:
      type: string
      format: uuid
      description: Take a feat instead of ability increases at an ASI level.
    spells:
      type: array
      items:
        type: string
        format: uuid
      description: New spell picks gained with this level (casters only).
    spellSwaps:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/SpellSwap"
      description: >-
        Spells traded on gaining this level, for classes whose spellChanges
        rule says level-up (Bard, Sorcerer, Warlock).
    asi:
      type: object
      description: Ability increases at an ASI level; total of 2 points, each +1 or +2.
      additionalProperties: false
      properties:
        str: { type: integer, minimum: 1, maximum: 2 }
        dex: { type: integer, minimum: 1, maximum: 2 }
        con: { type: integer, minimum: 1, maximum: 2 }
        int: { type: integer, minimum: 1, maximum: 2 }
        wis: { type: integer, minimum: 1, maximum: 2 }
        cha: { type: integer, minimum: 1, maximum: 2 }

SeatConflict:
  type: object
  required: [error, missing]
  properties:
    error:
      type: string
    missing:
      type: array
      description: Content the hero uses that the codex has not admitted.
      items:
        type: object
        required: [id, kind, name, state]
        properties:
          id:
            type: string
            format: uuid
          kind:
            type: string
          name:
            type: string
          state:
            type: string
            enum: [absent, proposed, banned]
            description: absent = never offered; proposed = awaiting the DM; banned = the DM said no.

SpellSlotsInput:
  type: object
  required: [used]
  properties:
    used:
      type: array
      maxItems: 9
      items:
        type: integer
        minimum: 0
      description: >
        Slots spent per spell level (index 0 = level 1) in the shared pool.
        Pact Magic is counted apart — see `pactUsed`.
    pactUsed:
      type: integer
      minimum: 0
      description: >
        Pact Magic slots spent. Its own count because the two pools never
        merge: a Warlock 3 / Wizard 3 spending a pact slot must not show a
        Wizard slot gone (PHB 2024, p.44). Omit to leave it as it was.

InventoryItem:
  type: object
  required: [id, name, qty, equipped, attuned]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    qty:
      type: integer
      description: >-
        How many. For the purse (#195) this is the hero's coin in BASE units —
        the campaign's smallest denomination — which is what lets it be broken
        back into coins for display.
    isPurse:
      type: boolean
      description: >-
        True for the one row that is the hero's coin. It used to be inferred
        from the name "Gold Pieces" in four places at once, a rule that stopped
        being true the moment a DM renamed their currency (#195).
    equipped:
      type: boolean
    attuned:
      type: boolean
      description: >-
        Whether this row holds one of the hero's three attunements. Per row
        regardless of qty — the same way a stack equipped in a hand fights
        as one weapon — and independent of equipped: stowing a ring does
        not break the bond.
    slot:
      type: string
      enum: ["", armor, mainhand, offhand, bothhands,
             cloak, amulet, helm, belt, boots, gloves, bracers, ring1, ring2]
      description: >-
        Where an equipped item sits; empty when stowed. `bothhands` is a
        two-handed grip — it occupies main and off hand at once, and a
        versatile weapon held so rolls its bigger die. Beyond the battle
        slots, an item whose data declares a `wear` kind occupies the
        matching worn slot (rings get two).
    content:
      $ref: "../openapi.yaml#/components/schemas/RulesContent"
      nullable: true
      description: The rules entry behind this row; null for free-text gear.

InventoryItemInput:
  type: object
  properties:
    contentId:
      type: string
      format: uuid
      description: An item from the library — or omit and use name for free-text gear.
    name:
      type: string
      maxLength: 80
    qty:
      type: integer
      minimum: 1
      maximum: 1000000
      default: 1

InventoryItemPatch:
  type: object
  properties:
    qty:
      type: integer
      minimum: 1
      maximum: 1000000
    equipped:
      type: boolean
    slot:
      type: string
      enum: [armor, mainhand, offhand, bothhands,
             cloak, amulet, helm, belt, boots, gloves, bracers, ring1, ring2]
      description: >-
        Equip into a specific slot (implies equipped). Armor only fits
        the armor slot, shields only the off-hand; a one-handed weapon
        fits either hand; a Two-Handed weapon only `bothhands`, and a
        Versatile one may take `bothhands` for its bigger die; a worn
        item (its data declares `wear`) fits only its own kind's slot —
        rings either ring slot. A two-handed grip displaces whatever
        either hand held. Displaced occupants are unequipped in the same
        stroke. Use equipped:false to stow.
    attuned:
      type: boolean
      description: >-
        Form or break the bond. Only a library item whose data declares
        `attunement` can attune, and three attuned rows are the most a
        hero can hold; false always succeeds. Independent of equipped.

Spellcaster:
  type: object
  required: [classId, className, ability, spellIds]
  description: |
    One class a hero casts from. A Ranger 4 / Sorcerer 3 has two: they prepare
    for each "as if you were a single-classed member of that class", and each
    spell is cast off the ability of the class it belongs to (PHB 2024, p.44).
  properties:
    classId:
      type: string
      format: uuid
    className:
      type: string
    ability:
      type: string
      description: STR…CHA — what this class's spells are cast off.
    cantripsKnown:
      type: integer
      description: How many cantrips this class allows at the hero's level in it.
    prepared:
      type: integer
      description: How many levelled spells this class allows at the hero's level in it.
    maxSpellLevel:
      type: integer
      description: >
        The highest spell level this class may PREPARE, from its own level.
        Slots can be higher than this — the shared pool may hand a Ranger 4 /
        Sorcerer 3 a level 3 slot they have no level 3 spell to put in it.
    spellIds:
      type: array
      description: The hero's spells belonging to this class.
      items:
        type: string
        format: uuid

CharacterDetail:
  type: object
  required: [character, spells, items, creatures]
  properties:
    character:
      $ref: "../openapi.yaml#/components/schemas/Character"
    spells:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/RulesContent"
    casters:
      type: array
      description: >
        The classes this hero casts from, and which of their spells belong to
        each. Absent for a non-caster. Additive to `spells`, which stays the
        flat list every surface already reads.
      items:
        $ref: "../openapi.yaml#/components/schemas/Spellcaster"
    items:
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/InventoryItem"
    creatures:
      type: array
      description: >-
        The hero's second stat blocks — forms they take and companions that
        fight beside them — already resolved, so the sheet needs no second
        round trip and players need no reach into the Den.
      items:
        $ref: "../openapi.yaml#/components/schemas/CharacterCreature"

RestRequest:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [long, short]
    hitDice:
      type: object
      description: >
        Short rest only: how many hit dice to spend healing, keyed by die size
        ("10": 2). A map rather than a count because a multiclassed hero holds
        more than one kind and may spend any mix of them — and because it has
        to be one request: a short rest also restores pact slots and pools, so
        taking two rests to spend two kinds of die would hand those back twice.
        Ignored on a long rest, which spends none.
      additionalProperties:
        type: integer
        minimum: 0

RestReport:
  type: object
  required:
    [character, kind, hpRestored, hitDiceSpent, hitDiceRegained, hitDiceLeft,
     slotsRestored, rolls, canSwapSpells, poolsRestored]
  properties:
    character:
      $ref: "../openapi.yaml#/components/schemas/Character"
    kind:
      type: string
    hpRestored:
      type: integer
      description: Hit points actually regained — 0 when the hero was already whole.
    hitDiceSpent:
      type: integer
    hitDiceRegained:
      type: integer
    hitDiceLeft:
      type: integer
      description: Hit dice still available to spend after this rest.
    slotsRestored:
      type: boolean
      description: >-
        Whether spell slots came back. Always on a long rest; on a short rest
        only for a pact caster, whose slots are the ones that return.
    rolls:
      type: array
      description: What each spent hit die rolled, before the CON modifier.
      items:
        type: integer
    canSwapSpells:
      type: boolean
      description: >-
        Whether this hero's class may change its prepared spells now — the
        long-rest trigger the spell swap has been waiting for.
    poolsRestored:
      type: array
      description: >-
        Names of the resource pools this rest gave uses back to — empty when
        none moved, or the hero has none.
      items:
        type: string
